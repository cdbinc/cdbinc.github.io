<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>CDB Studio — Mobile</title>
<script>
/* PONT API CDB — publie par scripts/publier_studio_web.py. NE PAS editer ici (regenere). */
(function () {
  var isLocal = ["localhost", "127.0.0.1"].indexOf(location.hostname) !== -1;
  if (isLocal) return;
  var API_TOKEN = "kPIdcmKI5jrEWw0dVo54428hNoLnPNqm";
  var orig = window.fetch.bind(window);
  function fetchT(url, opts, ms) {
    opts = opts || {};
    if (typeof AbortController === "function") {
      var ac = new AbortController(); opts.signal = ac.signal;
      var t = setTimeout(function () { ac.abort(); }, ms || 8000);
      return orig(url, opts).finally(function () { clearTimeout(t); });
    }
    return orig(url, opts);
  }
  var cachedBase = null;
  function resolveBase() {
    if (cachedBase) return Promise.resolve(cachedBase);
    return fetchT("/dispatch/relay.json?_=" + Date.now(), { cache: "no-store" }, 6000)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { cachedBase = (j && j.url) ? String(j.url).replace(/\/+$/, "") : null; return cachedBase; })
      .catch(function () { return null; });
  }
  window.fetch = function (input, init) {
    var url = (typeof input === "string") ? input : (input && input.url) || "";
    if (url.indexOf("/api/") !== 0) return orig(input, init);
    return resolveBase().then(function (base) {
      if (!base) return new Response(JSON.stringify({ ok: false, offline: true, error: "Relais CDB hors ligne." }),
        { status: 503, headers: { "Content-Type": "application/json" } });
      init = init || {};
      init.headers = Object.assign({}, init.headers, { "X-CDB-Token": API_TOKEN, "ngrok-skip-browser-warning": "1" });
      return fetchT(base + url, init, 30000).catch(function () {
        cachedBase = null;
        return new Response(JSON.stringify({ ok: false, offline: true, error: "Relais injoignable." }),
          { status: 503, headers: { "Content-Type": "application/json" } });
      });
    });
  };

  /* <img src="/api/..."> ET <a href="/api/..."> ne peuvent pas porter d'en-tete.
     Pour eviter la page d'avertissement ngrok, on TELECHARGE par fetch (avec
     X-CDB-Token + ngrok-skip-browser-warning) puis on sert un blob: objectURL. */
  var HDRS = { "X-CDB-Token": API_TOKEN, "ngrok-skip-browser-warning": "1" };
  function loadImg(el) {
    var s = el.getAttribute("src") || "";
    if (s.indexOf("/api/") !== 0 || el.getAttribute("data-cdb") === "1") return;
    el.setAttribute("data-cdb", "1");
    resolveBase().then(function (base) {
      if (!base) return;
      fetchT(base + s, { headers: HDRS }, 30000)
        .then(function (r) { return r.ok ? r.blob() : null; })
        .then(function (b) { if (b) el.setAttribute("src", URL.createObjectURL(b)); })
        .catch(function () {});
    });
  }
  function scan(root) {
    try { (root.querySelectorAll ? root.querySelectorAll('img[src^="/api/"]') : []).forEach(loadImg); } catch (e) {}
  }
  if (document.readyState !== "loading") scan(document);
  else document.addEventListener("DOMContentLoaded", function () { scan(document); });
  try {
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        (m.addedNodes || []).forEach(function (n) {
          if (n.nodeType === 1) { if (n.tagName === "IMG") loadImg(n); scan(n); }
        });
      });
    }).observe(document.documentElement, { childList: true, subtree: true });
  } catch (e) {}

  /* Liens /api/... (PDF/HTML) : au clic on telecharge par fetch (avec en-tetes) -> blob
     -> on ouvre l'objectURL. Aucun avertissement ngrok, aucun clic supplementaire. */
  document.addEventListener("click", function (e) {
    var a = (e.target && e.target.closest) ? e.target.closest('a[href^="/api/"]') : null;
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (href.indexOf("/api/") !== 0) return;
    e.preventDefault();
    var w = window.open("", "_blank");          // ouvert dans le geste -> non bloque
    resolveBase().then(function (base) {
      if (!base) { if (w) w.close(); alert("Relais CDB hors ligne — reessayez quand le tunnel est actif."); return; }
      fetchT(base + href, { headers: HDRS }, 30000)
        .then(function (r) { return r.ok ? r.blob() : null; })
        .then(function (b) {
          if (!b) { if (w) w.close(); return; }
          var u = URL.createObjectURL(b);
          if (w) { w.location = u; } else { window.location.href = u; }
        })
        .catch(function () { if (w) w.close(); });
    });
  }, true);
})();
</script>
<style>
  :root{ --navy:#1b2d6b; --navy2:#111e4a; --orange:#e8680a; --bg:#f4f6fb; --card:#fff;
         --ink:#161a24; --muted:#6b7280; --green:#1e8e4e; --red:#d23b3b; --line:#e3e7f1; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif; }
  header{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:linear-gradient(90deg,var(--navy2),var(--navy)); color:#fff; }
  .logo{ width:40px;height:40px;border-radius:11px;background:#fff;color:var(--navy);
    display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:-1px; }
  header h1{ font-size:17px; margin:0; font-weight:800; }
  header p{ font-size:12px; margin:2px 0 0; color:#aeb9dc; }
  .dot{ width:11px;height:11px;border-radius:50%; background:#9aa1b2;
    box-shadow:0 0 0 2px rgba(255,255,255,.25); margin-left:auto; }
  nav{ display:flex; background:var(--card); border-bottom:1px solid var(--line);
    position:sticky; top:64px; z-index:4; }
  nav button{ flex:1; border:0; background:none; padding:14px 8px; font-size:15px; font-weight:700;
    color:var(--muted); border-bottom:3px solid transparent; }
  nav button.on{ color:var(--navy); border-bottom-color:var(--orange); }
  main{ padding:16px; max-width:560px; margin:0 auto; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px;
    margin-bottom:14px; box-shadow:0 2px 10px rgba(20,30,60,.05); }
  h2{ font-size:18px; margin:0 0 12px; color:var(--navy); }
  label{ font-size:13px; font-weight:700; color:var(--muted); display:block; margin:0 0 6px; }
  input[type=file],textarea{ width:100%; font-size:16px; border:1px solid var(--line);
    border-radius:12px; padding:12px; background:#fbfcfe; }
  textarea{ min-height:70px; resize:vertical; }
  .btn{ width:100%; border:0; border-radius:14px; padding:18px; font-size:17px; font-weight:800;
    color:#fff; background:var(--orange); margin-top:12px; }
  .btn.navy{ background:var(--navy); } .btn.green{ background:var(--green); } .btn.red{ background:var(--red); }
  .btn.ghost{ background:#eef1f8; color:var(--navy); }
  .row{ display:flex; gap:10px; } .row .btn{ margin-top:0; }
  .gal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-top:12px; }
  .gal a,.gal div{ position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden;
    background:#e0e4f0; text-decoration:none; }
  .gal img{ width:100%;height:100%;object-fit:cover; }
  .gal .vid{ background:var(--navy); color:#fff; display:grid; place-items:center; font-size:24px; }
  .badge{ position:absolute; top:5px; right:5px; background:var(--orange); color:#fff;
    border-radius:9px; padding:1px 6px; font-size:11px; font-weight:800; }
  .post img{ width:100%; border-radius:14px; background:#eef1f8; margin-bottom:10px; }
  .post .cap{ width:100%; }
  .muted{ color:var(--muted); font-size:14px; }
  .empty{ text-align:center; color:var(--muted); padding:40px 10px; }
  .empty .big{ font-size:48px; }
  #toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:20;
    background:#101626; color:#fff; padding:13px 20px; border-radius:30px; font-weight:700;
    font-size:15px; opacity:0; transition:.2s; pointer-events:none; max-width:90%; text-align:center; }
  #toast.show{ opacity:1; } #toast.ok{ background:var(--green); } #toast.err{ background:var(--red); }
</style>
<meta name="theme-color" content="#1b2d6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CDB Studio">
<style id="cdb-mobile">
/* Super user-friendly sur cellulaire (injecte par publier_studio_web.py) */
@media (max-width: 720px){
  html,body{max-width:100%;overflow-x:hidden}
  body{font-size:15px;-webkit-text-size-adjust:100%;padding-left:10px;padding-right:10px}
  header,.brand,.produce,.tools,.actions,.row{flex-wrap:wrap}
  .tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;gap:6px;padding-bottom:6px}
  .tabs > *{flex:0 0 auto}
  .grid{display:block !important}
  .grid > *,.card{width:100% !important;max-width:100% !important;margin:0 0 12px !important;box-sizing:border-box}
  button,.btn,.btn-sec,.btn-ghost,.btn-publish,summary{min-height:46px;font-size:15px}
  button,.btn-sec,.btn-ghost,.btn-publish{width:100%;margin:4px 0}
  .produce,.tools,.actions{flex-direction:column !important;align-items:stretch !important}
  .produce > *,.tools > *{width:100% !important;min-width:0 !important;margin:3px 0}
  input,select,textarea{font-size:16px !important;width:100% !important;box-sizing:border-box}
  img{max-width:100% !important;height:auto}
  pre,.cmd,.log,code{overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-word}
  details,.adv{width:100%}
  table{display:block;overflow-x:auto}
}
button,a.btn,.btn-publish{-webkit-tap-highlight-color:rgba(232,104,10,.2)}
</style>
</head>
<body>
  <header>
    <div class="logo">CDB</div>
    <div><h1>CDB Studio</h1><p>Le souci du détail</p></div>
    <div class="dot" id="dot"></div>
  </header>
  <nav>
    <button id="t-send" class="on" onclick="show('send')">📸 Envoyer</button>
    <button id="t-appr" onclick="show('appr')">✅ Approuver</button>
  </nav>
  <main id="view"></main>
  <div id="toast"></div>

<script>
var CUR="send", CH=[], APPR=[];
function $(id){ return document.getElementById(id); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toast(m,k){ var t=$("toast"); t.textContent=m; t.className="show"+(k?(" "+k):"");
  clearTimeout(window._tt); window._tt=setTimeout(function(){ t.className=""; },3500); }
function post(p,b){ return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}); }

function setDot(ok){ $("dot").style.background = ok ? "#1e8e4e" : "#d23b3b"; }
function ping(){ fetch("/api/ops/status").then(function(r){ setDot(r.ok); return r.json(); })
  .then(function(){}).catch(function(){ setDot(false); }); }

function show(tab){ CUR=tab; $("t-send").className=tab==="send"?"on":""; $("t-appr").className=tab==="appr"?"on":"";
  if(tab==="send"){ renderSend(); loadGal(); } else { renderAppr(); loadAppr(); } }

/* ── ENVOYER ─────────────────────────────────────────────────────────── */
function renderSend(){
  $("view").innerHTML =
    "<div class='card'><h2>Envoyer une photo ou vidéo</h2>"+
    "<label>Photo / vidéo de chantier</label>"+
    "<input type='file' id='f' accept='image/*,video/*'>"+
    "<label style='margin-top:12px'>Légende (optionnel)</label>"+
    "<textarea id='cap' placeholder='Ex : Salle de bain terminée à Longueuil'></textarea>"+
    "<button class='btn' onclick='send()'>Envoyer</button>"+
    "<p class='muted' style='margin:10px 2px 0'>La photo est éditée par les agents (marque CDB) et passe dans « Approuver ». Les vidéos sont conservées.</p></div>"+
    "<div class='card'><h2>Mes envois</h2><div id='gal'></div></div>";
  paintGal();
}
function send(){
  var f=$("f").files[0]; if(!f){ toast("Choisis une photo ou une vidéo","err"); return; }
  var cap=($("cap").value||"").trim();
  var vid=/^video\//.test(f.type)||/\.(mp4|mov|webm)$/i.test(f.name);
  var url="/api/ops/upload?kind=chantiers&name=chantier"+(vid?".mp4":".jpg")+(cap?("&text="+encodeURIComponent(cap)):"")+(vid?"&media=video":"");
  toast(vid?"Envoi vidéo…":"Envoi + édition…");
  f.arrayBuffer().then(function(buf){ return fetch(url,{method:"POST",headers:{"Content-Type":vid?"video/mp4":"image/jpeg"},body:buf}); })
    .then(function(r){ return r.json(); }).then(function(d){
      if(d&&d.ok){ toast(vid?"Vidéo envoyée ✓":"Envoyée + éditée ✓","ok"); $("cap").value=""; $("f").value=""; loadGal(); }
      else toast("Erreur : "+((d&&d.error)||"?"),"err");
    }).catch(function(){ toast("Erreur réseau","err"); });
}
function loadGal(){ fetch("/api/ops/chantiers").then(function(r){ return r.json(); })
  .then(function(d){ CH=(d&&d.photos)||[]; paintGal(); }).catch(function(){}); }
function paintGal(){ var el=$("gal"); if(!el) return;
  if(!CH.length){ el.innerHTML="<p class='muted'>Aucun envoi pour le moment.</p>"; return; }
  el.className="gal";
  el.innerHTML=CH.map(function(c){
    if(c.type==="video") return "<a href='"+c.url+"' target='_blank'><div class='vid'>🎥</div></a>";
    var s=c.edited_url||c.url;
    return "<div><img src='"+s+"'>"+(c.edited?"<span class='badge'>✨</span>":"")+"</div>";
  }).join("");
}

/* ── APPROUVER ───────────────────────────────────────────────────────── */
function renderAppr(){ $("view").innerHTML="<div id='ap'></div>"; paintAppr(); }
function loadAppr(){ fetch("/api/ops/approvals").then(function(r){ return r.json(); })
  .then(function(d){ APPR=(d&&d.pending)||[]; paintAppr(); }).catch(function(){ APPR=[]; paintAppr(); }); }
function paintAppr(){ var el=$("ap"); if(!el) return;
  if(!APPR.length){ el.innerHTML="<div class='empty'><div class='big'>✅</div>Rien à approuver. Tout est à jour.</div>"; return; }
  el.innerHTML=APPR.map(function(p){ return (
    "<div class='card post'>"+
    "<img src='"+p.image_url+"' alt=''>"+
    "<label>Texte de la publication</label>"+
    "<textarea class='cap' id='cap_"+p.id+"'>"+esc(p.text)+"</textarea>"+
    "<button class='btn ghost' onclick=\"saveCap('"+p.id+"')\">Enregistrer le texte</button>"+
    "<div class='row' style='margin-top:10px'>"+
    "<button class='btn green' onclick=\"pub('"+p.id+"')\">Publier 🚀</button>"+
    "<button class='btn red' onclick=\"rej('"+p.id+"')\">Rejeter</button>"+
    "</div></div>"); }).join("");
}
function saveCap(id){ var t=($("cap_"+id).value||"").trim(); if(!t){ toast("Texte vide","err"); return; }
  toast("Enregistrement…"); post("/api/ops/approval-text",{id:id,text:t}).then(function(r){ return r.json(); })
    .then(function(d){ toast(d&&d.ok?"Texte enregistré ✓":"Erreur",d&&d.ok?"ok":"err"); loadAppr(); })
    .catch(function(){ toast("Erreur réseau","err"); }); }
function pub(id){ if(!confirm("Publier partout maintenant ?")) return; var file=id+".json"; toast("Publication…");
  post("/api/approve",{file:file,confirm:"APPROUVER"}).then(function(r){ return r.json(); }).then(function(){
    return fetch("/api/pubtoken").then(function(r){ return r.json(); }).then(function(tk){
      return fetch("/api/publish-all",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({file:file,token:(tk&&tk.token)||""})}); });
  }).then(function(r){ return r.json(); }).then(function(d){ toast("Publié partout ✓","ok"); loadAppr(); })
    .catch(function(){ toast("Erreur réseau","err"); }); }
function rej(id){ if(!confirm("Rejeter cette publication ?")) return;
  post("/api/discard",{file:id+".json"}).then(function(r){ return r.json(); })
    .then(function(d){ toast("Rejetée","ok"); loadAppr(); }).catch(function(){ toast("Erreur réseau","err"); }); }

ping(); setInterval(ping,30000); show("send");
</script>
</body>
</html>
