<title>CDB Studio — Mobile</title>
<script>
/* PONT API CDB — publie par scripts/publier_studio_web.py. NE PAS editer ici (regenere). */
(function () {
  var isLocal = ["localhost", "127.0.0.1"].indexOf(location.hostname) !== -1;
  if (isLocal) return;
  var API_TOKEN = "kPIdcmKI5jrEWw0dVo54428hNoLnPNqm";
  var orig = window.fetch.bind(window);
  function fetchT(url, opts, ms) {
    opts = opts || {};
    if (typeof AbortController === "function") {
      var ac = new AbortController(); opts.signal = ac.signal;
      var t = setTimeout(function () { ac.abort(); }, ms || 8000);
      return orig(url, opts).finally(function () { clearTimeout(t); });
    }
    return orig(url, opts);
  }
  var cachedBase = null;
  function resolveBase() {
    if (cachedBase) return Promise.resolve(cachedBase);
    return fetchT("/dispatch/relay.json?_=" + Date.now(), { cache: "no-store" }, 6000)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { cachedBase = (j && j.url) ? String(j.url).replace(/\/+$/, "") : null; return cachedBase; })
      .catch(function () { return null; });
  }
  window.fetch = function (input, init) {
    var url = (typeof input === "string") ? input : (input && input.url) || "";
    if (url.indexOf("/api/") !== 0) return orig(input, init);
    return resolveBase().then(function (base) {
      if (!base) return new Response(JSON.stringify({ ok: false, offline: true, error: "Relais CDB hors ligne." }),
        { status: 503, headers: { "Content-Type": "application/json" } });
      init = init || {};
      init.headers = Object.assign({}, init.headers, { "X-CDB-Token": API_TOKEN, "ngrok-skip-browser-warning": "1" });
      return fetchT(base + url, init, 30000).catch(function () {
        cachedBase = null;
        return new Response(JSON.stringify({ ok: false, offline: true, error: "Relais injoignable." }),
          { status: 503, headers: { "Content-Type": "application/json" } });
      });
    });
  };

  /* <img src="/api/..."> ET <a href="/api/..."> ne peuvent pas porter d'en-tete.
     Pour eviter la page d'avertissement ngrok, on TELECHARGE par fetch (avec
     X-CDB-Token + ngrok-skip-browser-warning) puis on sert un blob: objectURL. */
  var HDRS = { "X-CDB-Token": API_TOKEN, "ngrok-skip-browser-warning": "1" };
  function loadImg(el) {
    var s = el.getAttribute("src") || "";
    if (s.indexOf("/api/") !== 0 || el.getAttribute("data-cdb") === "1") return;
    el.setAttribute("data-cdb", "1");
    resolveBase().then(function (base) {
      if (!base) return;
      fetchT(base + s, { headers: HDRS }, 30000)
        .then(function (r) { return r.ok ? r.blob() : null; })
        .then(function (b) { if (b) el.setAttribute("src", URL.createObjectURL(b)); })
        .catch(function () {});
    });
  }
  function scan(root) {
    try { (root.querySelectorAll ? root.querySelectorAll('img[src^="/api/"]') : []).forEach(loadImg); } catch (e) {}
  }
  if (document.readyState !== "loading") scan(document);
  else document.addEventListener("DOMContentLoaded", function () { scan(document); });
  try {
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        (m.addedNodes || []).forEach(function (n) {
          if (n.nodeType === 1) { if (n.tagName === "IMG") loadImg(n); scan(n); }
        });
      });
    }).observe(document.documentElement, { childList: true, subtree: true });
  } catch (e) {}

  /* Liens /api/... (PDF/HTML) : au clic on telecharge par fetch (avec en-tetes) -> blob
     -> on ouvre l'objectURL. Aucun avertissement ngrok, aucun clic supplementaire. */
  document.addEventListener("click", function (e) {
    var a = (e.target && e.target.closest) ? e.target.closest('a[href^="/api/"]') : null;
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (href.indexOf("/api/") !== 0) return;
    e.preventDefault();
    var w = window.open("", "_blank");          // ouvert dans le geste -> non bloque
    resolveBase().then(function (base) {
      if (!base) { if (w) w.close(); alert("Relais CDB hors ligne — reessayez quand le tunnel est actif."); return; }
      fetchT(base + href, { headers: HDRS }, 30000)
        .then(function (r) { return r.ok ? r.blob() : null; })
        .then(function (b) {
          if (!b) { if (w) w.close(); return; }
          var u = URL.createObjectURL(b);
          if (w) { w.location = u; } else { window.location.href = u; }
        })
        .catch(function () { if (w) w.close(); });
    });
  }, true);
})();
</script>

<style>
  :root{ --navy:#1b2d6b; --navy2:#111e4a; --orange:#e8680a; --bg:#eef1f8; --card:#fff;
         --ink:#141823; --muted:#69708a; --green:#1e8e4e; --red:#d23b3b; --line:#e3e7f1; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); overscroll-behavior-y:contain;
    font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif; }
  header{ position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
    background:linear-gradient(120deg,var(--navy2),var(--navy)); color:#fff;
    box-shadow:0 4px 18px rgba(17,30,74,.28); }
  .logo{ width:42px;height:42px;border-radius:12px;background:#fff;color:var(--navy);
    display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:-1.5px; flex:0 0 auto; }
  header h1{ font-size:17px; margin:0; font-weight:800; letter-spacing:.2px; }
  header p{ font-size:11.5px; margin:2px 0 0; color:#aeb9dc; }
  .dot{ width:11px;height:11px;border-radius:50%; background:#9aa1b2;
    box-shadow:0 0 0 3px rgba(255,255,255,.18); margin-left:auto; flex:0 0 auto; transition:.3s; }
  nav{ display:flex; background:var(--card); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5; box-shadow:0 2px 8px rgba(20,30,60,.04); }
  nav button{ flex:1; border:0; background:none; padding:13px 6px 11px; font-size:13px; font-weight:800;
    color:var(--muted); border-bottom:3px solid transparent; display:flex; flex-direction:column;
    align-items:center; gap:3px; position:relative; }
  nav button .ic{ font-size:20px; line-height:1; }
  nav button.on{ color:var(--navy); border-bottom-color:var(--orange); }
  nav .cnt{ position:absolute; top:6px; right:50%; margin-right:-26px; background:var(--orange); color:#fff;
    font-size:10px; min-width:17px; height:17px; border-radius:9px; display:none; place-items:center;
    padding:0 4px; font-weight:800; }
  nav .cnt.show{ display:grid; }
  main{ padding:16px; max-width:560px; margin:0 auto; padding-bottom:40px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px;
    margin-bottom:14px; box-shadow:0 4px 16px rgba(20,30,60,.06); }
  h2{ font-size:18px; margin:0 0 14px; color:var(--navy); display:flex; align-items:center; gap:8px; }
  label{ font-size:12.5px; font-weight:800; color:var(--muted); display:block; margin:0 0 7px;
    text-transform:uppercase; letter-spacing:.4px; }
  textarea{ width:100%; font-size:16px; border:1.5px solid var(--line); border-radius:14px; padding:13px;
    background:#fafbfe; resize:vertical; min-height:64px; font-family:inherit; }
  textarea:focus{ outline:none; border-color:var(--navy); }
  .btn{ width:100%; border:0; border-radius:16px; padding:17px; font-size:16px; font-weight:800;
    color:#fff; background:var(--orange); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn:active{ transform:scale(.985); }
  .btn.navy{ background:var(--navy); } .btn.green{ background:var(--green); } .btn.red{ background:var(--red); }
  .btn.ghost{ background:#eef1f8; color:var(--navy); box-shadow:none; }
  .btn[disabled]{ opacity:.5; }
  .pick{ display:flex; gap:10px; } .pick .btn{ padding:15px 8px; font-size:14px; }
  .prev{ margin:14px 0 0; border-radius:14px; overflow:hidden; background:#eef1f8; display:none; position:relative; }
  .prev img,.prev video{ width:100%; display:block; max-height:280px; object-fit:cover; }
  .prev .x{ position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); color:#fff; width:30px;height:30px;
    border-radius:50%; border:0; font-size:17px; }
  .mt{ margin-top:12px; }
  .gal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; margin-top:8px; }
  .gal .cell{ position:relative; aspect-ratio:1; border-radius:13px; overflow:hidden; background:#dde3f0; }
  .gal img{ width:100%;height:100%;object-fit:cover; }
  .gal .vid{ width:100%;height:100%; background:var(--navy); color:#fff; display:grid; place-items:center; font-size:26px; }
  .badge{ position:absolute; top:5px; right:5px; background:var(--orange); color:#fff;
    border-radius:9px; padding:1px 6px; font-size:11px; font-weight:800; }
  .post img{ width:100%; border-radius:15px; background:#eef1f8; margin-bottom:12px; display:block; }
  .muted{ color:var(--muted); font-size:13.5px; line-height:1.5; }
  .empty{ text-align:center; color:var(--muted); padding:46px 12px; }
  .empty .big{ font-size:52px; margin-bottom:6px; }
  .srv{ display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line); }
  .srv:last-child{ border-bottom:0; }
  .sdot{ width:13px;height:13px;border-radius:50%; flex:0 0 auto; }
  .srv b{ font-size:15px; } .srv small{ color:var(--muted); display:block; font-size:12px; }
  #ov{ position:fixed; inset:0; background:rgba(8,12,24,.94); z-index:30; display:none;
    align-items:center; justify-content:center; padding:16px; }
  #ov img{ max-width:100%; max-height:100%; border-radius:10px; }
  #toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 26px); transform:translateX(-50%);
    z-index:40; background:#0e1422; color:#fff; padding:14px 22px; border-radius:30px; font-weight:700;
    font-size:15px; opacity:0; transition:.25s; pointer-events:none; max-width:88%; text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.3); }
  #toast.show{ opacity:1; } #toast.ok{ background:var(--green); } #toast.err{ background:var(--red); }
  .spin{ width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    display:inline-block; animation:sp .7s linear infinite; } @keyframes sp{ to{ transform:rotate(360deg); } }
</style>

<style id="cdb-mobile">
/* Super user-friendly sur cellulaire (injecte par publier_studio_web.py) */
@media (max-width: 720px){
  html,body{max-width:100%;overflow-x:hidden}
  body{font-size:15px;-webkit-text-size-adjust:100%;padding-left:10px;padding-right:10px}
  header,.brand,.produce,.tools,.actions,.row{flex-wrap:wrap}
  .tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;gap:6px;padding-bottom:6px}
  .tabs > *{flex:0 0 auto}
  .grid{display:block !important}
  .grid > *,.card{width:100% !important;max-width:100% !important;margin:0 0 12px !important;box-sizing:border-box}
  button,.btn,.btn-sec,.btn-ghost,.btn-publish,summary{min-height:46px;font-size:15px}

  .produce > *,.tools > *{width:100% !important;min-width:0 !important;margin:3px 0}
  input,select,textarea{font-size:16px !important;width:100% !important;box-sizing:border-box}
  img{max-width:100% !important;height:auto}
  pre,.cmd,.log,code{overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-word}

button,a.btn,.btn-publish{-webkit-tap-highlight-color:rgba(232,104,10,.2)}

<body>
  <header>
    <div class="logo">CDB</div>
    <div><h1>CDB Studio</h1><p>Le souci du détail</p></div>
    <div class="dot" id="dot"></div>
  </header>
  <nav>
    <button id="t-send" class="on" onclick="show('send')"><span class="ic">📸</span>Envoyer</button>
    <button id="t-appr" onclick="show('appr')"><span class="ic">✅</span>Approuver<span class="cnt" id="cnt"></span></button>
    <button id="t-stat" onclick="show('stat')"><span class="ic">🩺</span>État</button>
  </nav>
  <main id="view"></main>

  <input type="file" id="cam" accept="image/*" capture="environment" hidden onchange="onPick(this)">
  <input type="file" id="vcam" accept="video/*" capture="environment" hidden onchange="onPick(this)">
  <input type="file" id="fil" accept="image/*,video/*" hidden onchange="onPick(this)">
  <div id="ov" onclick="this.style.display='none'"><img id="ovimg" src="" alt=""></div>
  <div id="toast"></div>

<script>
var CUR="send", CH=[], APPR=[], SEL=null, SRV=[];
function $(id){ return document.getElementById(id); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toast(m,k){ var t=$("toast"); t.innerHTML=m; t.className="show"+(k?(" "+k):"");
  clearTimeout(window._tt); window._tt=setTimeout(function(){ t.className=""; },3500); }
function post(p,b){ return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}); }
function viewImg(src){ $("ovimg").src=src; $("ov").style.display="flex"; }

function ping(){ fetch("/api/ops/status").then(function(r){ return r.json(); })
  .then(function(d){ SRV=(d&&d.services)||[]; var up=d&&d.ok; $("dot").style.background=up?"#36d27a":"#ff5a5a";
    if(CUR==="stat") renderStat(); }).catch(function(){ $("dot").style.background="#ff5a5a"; SRV=[]; if(CUR==="stat")renderStat(); }); }

function show(tab){ CUR=tab;
  ["send","appr","stat"].forEach(function(t){ $("t-"+t).className=(t===tab?"on":""); });
  if(tab==="send"){ renderSend(); loadGal(); }
  else if(tab==="appr"){ renderAppr(); loadAppr(); }
  else { renderStat(); ping(); } }

/* ── ENVOYER ─────────────────────────────────────────────────────────── */
function renderSend(){
  $("view").innerHTML =
    "<div class='card'><h2>📸 Envoyer</h2>"+
    "<div class='pick'>"+
      "<button class='btn navy' onclick=\"$('cam').click()\">📷 Photo</button>"+
      "<button class='btn navy' onclick=\"$('vcam').click()\">🎥 Vidéo</button>"+
      "<button class='btn ghost' onclick=\"$('fil').click()\">📁 Fichier</button>"+
    "</div>"+
    "<div class='prev' id='prev'></div>"+
    "<label class='mt'>Légende (optionnel)</label>"+
    "<textarea id='cap' placeholder='Ex : Salle de bain terminée à Longueuil'></textarea>"+
    "<button class='btn mt' id='sendbtn' onclick='send()' disabled>Envoyer</button>"+
    "<p class='muted mt'>La photo est éditée par les agents (marque CDB) et passe dans « Approuver ». Les vidéos sont conservées.</p></div>"+
    "<div class='card'><h2>🖼️ Mes envois</h2><div id='gal'></div></div>";
  paintGal();
}
function onPick(inp){ var f=inp.files[0]; if(!f) return; SEL=f;
  var p=$("prev"); var vid=/^video\//.test(f.type); var u=URL.createObjectURL(f);
  p.style.display="block";
  p.innerHTML=(vid?("<video src='"+u+"' muted playsinline></video>"):("<img src='"+u+"'>"))+
    "<button class='x' onclick='clearSel()'>✕</button>";
  $("sendbtn").disabled=false;
  // reset les autres inputs pour permettre re-choisir le meme fichier
  ["cam","vcam","fil"].forEach(function(id){ if($(id)!==inp) $(id).value=""; });
}
function clearSel(){ SEL=null; $("prev").style.display="none"; $("prev").innerHTML="";
  $("sendbtn").disabled=true; ["cam","vcam","fil"].forEach(function(id){ $(id).value=""; }); }
function send(){
  if(!SEL){ toast("Choisis une photo ou une vidéo","err"); return; }
  var f=SEL, cap=($("cap").value||"").trim();
  var vid=/^video\//.test(f.type)||/\.(mp4|mov|webm)$/i.test(f.name);
  var url="/api/ops/upload?kind=chantiers&name=chantier"+(vid?".mp4":".jpg")+(cap?("&text="+encodeURIComponent(cap)):"")+(vid?"&media=video":"");
  var b=$("sendbtn"); b.disabled=true; b.innerHTML="<span class='spin'></span> Envoi…";
  f.arrayBuffer().then(function(buf){ return fetch(url,{method:"POST",headers:{"Content-Type":vid?"video/mp4":"image/jpeg"},body:buf}); })
    .then(function(r){ return r.json(); }).then(function(d){
      b.innerHTML="Envoyer";
      if(d&&d.ok){ toast(vid?"Vidéo envoyée ✓":"Envoyée + éditée ✓","ok"); $("cap").value=""; clearSel(); loadGal(); }
      else { toast("Erreur : "+((d&&d.error)||"?"),"err"); b.disabled=false; }
    }).catch(function(){ b.innerHTML="Envoyer"; b.disabled=false; toast("Erreur réseau","err"); });
}
function loadGal(){ fetch("/api/ops/chantiers").then(function(r){ return r.json(); })
  .then(function(d){ CH=(d&&d.photos)||[]; paintGal(); }).catch(function(){}); }
function paintGal(){ var el=$("gal"); if(!el) return;
  if(!CH.length){ el.innerHTML="<p class='muted'>Aucun envoi pour le moment.</p>"; return; }
  el.className="gal";
  el.innerHTML=CH.map(function(c,i){
    if(c.type==="video") return "<a class='cell' href='"+c.url+"' target='_blank'><div class='vid'>🎥</div></a>";
    var s=c.edited_url||c.url;
    return "<div class='cell' onclick=\"viewImg('"+s+"')\"><img src='"+s+"'>"+(c.edited?"<span class='badge'>✨</span>":"")+"</div>";
  }).join("");
}

/* ── APPROUVER ───────────────────────────────────────────────────────── */
function renderAppr(){ $("view").innerHTML="<div id='ap'></div>"; paintAppr(); }
function loadAppr(){ fetch("/api/ops/approvals").then(function(r){ return r.json(); })
  .then(function(d){ APPR=(d&&d.pending)||[]; var c=$("cnt"); c.textContent=APPR.length; c.className="cnt"+(APPR.length?" show":""); paintAppr(); })
  .catch(function(){ APPR=[]; paintAppr(); }); }
function paintAppr(){ var el=$("ap"); if(!el) return;
  if(!APPR.length){ el.innerHTML="<div class='empty'><div class='big'>✅</div>Rien à approuver.<br>Tout est à jour.</div>"; return; }
  el.innerHTML=APPR.map(function(p){ return (
    "<div class='card'>"+
    "<img class='post-img' src='"+p.image_url+"' onclick=\"viewImg('"+p.image_url+"')\" style='width:100%;border-radius:15px;margin-bottom:12px;background:#eef1f8' alt=''>"+
    "<label>Texte de la publication</label>"+
    "<textarea id='cap_"+p.id+"'>"+esc(p.text)+"</textarea>"+
    "<button class='btn ghost mt' onclick=\"saveCap('"+p.id+"')\">💾 Enregistrer le texte</button>"+
    "<div class='pick mt'>"+
      "<button class='btn green' onclick=\"pub('"+p.id+"')\">🚀 Publier</button>"+
      "<button class='btn red' onclick=\"rej('"+p.id+"')\">Rejeter</button>"+
    "</div></div>"); }).join("");
}
function saveCap(id){ var t=($("cap_"+id).value||"").trim(); if(!t){ toast("Texte vide","err"); return; }
  toast("Enregistrement…"); post("/api/ops/approval-text",{id:id,text:t}).then(function(r){ return r.json(); })
    .then(function(d){ toast(d&&d.ok?"Texte enregistré ✓":"Erreur",d&&d.ok?"ok":"err"); loadAppr(); })
    .catch(function(){ toast("Erreur réseau","err"); }); }
function pub(id){ if(!confirm("Publier partout maintenant ?")) return; var file=id+".json"; toast("Publication…");
  post("/api/approve",{file:file,confirm:"APPROUVER"}).then(function(r){ return r.json(); }).then(function(){
    return fetch("/api/pubtoken").then(function(r){ return r.json(); }).then(function(tk){
      return fetch("/api/publish-all",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({file:file,token:(tk&&tk.token)||""})}); });
  }).then(function(r){ return r.json(); }).then(function(){ toast("Publié partout ✓","ok"); loadAppr(); })
    .catch(function(){ toast("Erreur réseau","err"); }); }
function rej(id){ if(!confirm("Rejeter cette publication ?")) return;
  post("/api/discard",{file:id+".json"}).then(function(r){ return r.json(); })
    .then(function(){ toast("Rejetée","ok"); loadAppr(); }).catch(function(){ toast("Erreur réseau","err"); }); }

/* ── ÉTAT ────────────────────────────────────────────────────────────── */
function sdot(s){ return s==="up"||s==="config" ? "#1e8e4e" : (s==="down"||s==="absent" ? "#d23b3b" : "#9aa1b2"); }
function renderStat(){
  var good = SRV.length && SRV.every(function(s){ return s.state!=="down"&&s.state!=="absent"; });
  var head = "<div class='card' style='background:"+(good?"#1e8e4e":"#e8680a")+";color:#fff;border:0'>"+
    "<div style='display:flex;align-items:center;gap:12px'><span style='font-size:30px'>"+(good?"✅":"⚠️")+"</span>"+
    "<b style='font-size:18px'>"+(good?"Tout fonctionne":"Un service à vérifier")+"</b></div></div>";
  var rows = SRV.length ? SRV.map(function(s){ return "<div class='srv'><span class='sdot' style='background:"+sdot(s.state)+"'></span>"+
    "<div style='flex:1'><b>"+esc(s.label)+"</b>"+(s.detail?"<small>"+esc(s.detail)+"</small>":"")+"</div></div>"; }).join("")
    : "<div class='empty'><div class='big'>🔌</div>Serveur hors ligne.</div>";
  $("view").innerHTML = head + "<div class='card'><h2>🩺 Services</h2>"+rows+
    "<button class='btn ghost mt' onclick='ping()'>↻ Rafraîchir</button></div>";
}

ping(); setInterval(ping,30000); show("send");
</script>
</body>
</html>
