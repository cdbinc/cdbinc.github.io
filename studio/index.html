<script>
/* ===================================================================
   PONT API CDB — transport environment-aware (miroir de CdbApi.kt).
   • En LOCAL (localhost/127.0.0.1) : fetch /api/* direct (node 8787 ou relais).
   • EN LIGNE : /api/* re-route via le tunnel relais (relay.json) + jeton.
   Le bloc se DESACTIVE tout seul en local (isLocal). Le meme fichier sert
   donc de source GUI locale ET de webapp publique — parfaitement synchros.
   =================================================================== */
window.CDB = window.CDB || {};
(function () {
  var isLocal = ["localhost", "127.0.0.1", ""].indexOf(location.hostname) !== -1
             || location.protocol === "file:";
  window.CDB.isLocal = isLocal;

  window.CDB.base = "";                 // "" en local ; tunnel en ligne
  if (isLocal) return;

  var API_TOKEN = window.CDB.API_TOKEN;
  var orig = window.fetch.bind(window);
  function fetchT(url, opts, ms) {
    opts = opts || {};
    if (typeof AbortController === "function") {
      var ac = new AbortController(); opts.signal = ac.signal;
      var t = setTimeout(function () { ac.abort(); }, ms || 8000);
      return orig(url, opts).finally(function () { clearTimeout(t); });
    }
    return orig(url, opts);
  }
  var cachedBase = null;
  var RELAY_SOURCES = [
    "/dispatch/relay.json",
    "https://raw.githubusercontent.com/cdbinc/cdbinc.github.io/main/dispatch/relay.json",
    "https://cliniquedubatiment.ca/dispatch/relay.json"
  ];
  function tryRelay(i) {
    if (i >= RELAY_SOURCES.length) return Promise.resolve(null);
    return fetchT(RELAY_SOURCES[i] + (RELAY_SOURCES[i].indexOf("?") < 0 ? "?_=" : "&_=") + Date.now(), { cache: "no-store" }, 6000)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var u = j && (j.url || j.base);
        if (u) { return String(u).replace(/\/+$/, ""); }
        return tryRelay(i + 1);
      })
      .catch(function () { return tryRelay(i + 1); });
  }
  function resolveBase() {
    if (cachedBase) return Promise.resolve(cachedBase);
    return tryRelay(0).then(function (b) { cachedBase = b; window.CDB.base = b || ""; return b; });
  }
  window.CDB.resolveBase = resolveBase;
  window.CDB.dropBase = function () { cachedBase = null; window.CDB.base = ""; };

  window.fetch = function (input, init) {
    var url = (typeof input === "string") ? input : (input && input.url) || "";
    if (url.indexOf("/api/") !== 0 && url.indexOf("/approve") !== 0 && url.indexOf("/health") !== 0)
      return orig(input, init);
    return resolveBase().then(function (base) {
      if (!base) return new Response(JSON.stringify({ ok: false, offline: true, error: "Relais CDB hors ligne." }),
        { status: 503, headers: { "Content-Type": "application/json" } });
      init = init || {};
      init.headers = Object.assign({}, init.headers, { "X-CDB-Token": API_TOKEN, "ngrok-skip-browser-warning": "1" });
      return fetchT(base + url, init, 60000).catch(function () {
        cachedBase = null; window.CDB.base = "";
        return new Response(JSON.stringify({ ok: false, offline: true, error: "Relais injoignable." }),
          { status: 503, headers: { "Content-Type": "application/json" } });
      });
    });
  };

  /* <img src="/api/..."> ne porte pas d'en-tete : on telecharge en blob (avec jeton). */
  var HDRS = { "X-CDB-Token": API_TOKEN, "ngrok-skip-browser-warning": "1" };
  function loadImg(el) {
    var s = el.getAttribute("src") || "";
    if (s.indexOf("/api/") !== 0 || el.getAttribute("data-cdb") === "1") return;
    el.setAttribute("data-cdb", "1");
    resolveBase().then(function (base) {
      if (!base) return;
      fetchT(base + s, { headers: HDRS }, 60000)
        .then(function (r) { return r.ok ? r.blob() : null; })
        .then(function (b) { if (b) el.setAttribute("src", URL.createObjectURL(b)); })
        .catch(function () {});
    });
  }
  function scan(root) { try { (root.querySelectorAll ? root.querySelectorAll('img[src^="/api/"]') : []).forEach(loadImg); } catch (e) {} }
  window.CDB.scanImgs = scan;
  if (document.readyState !== "loading") scan(document);
  else document.addEventListener("DOMContentLoaded", function () { scan(document); });
  try {
    new MutationObserver(function (muts) {
      muts.forEach(function (m) { (m.addedNodes || []).forEach(function (n) {
        if (n.nodeType === 1) { if (n.tagName === "IMG") loadImg(n); scan(n); } }); });
    }).observe(document.documentElement, { childList: true, subtree: true });
  } catch (e) {}

  /* Liens /api/... (PDF/HTML) : clic -> fetch blob -> ouvre objectURL. */
  document.addEventListener("click", function (e) {
    var a = (e.target && e.target.closest) ? e.target.closest('a[href^="/api/"]') : null;
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (href.indexOf("/api/") !== 0) return;
    e.preventDefault();
    var w = window.open("", "_blank");
    resolveBase().then(function (base) {
      if (!base) { if (w) w.close(); alert("Relais CDB hors ligne — reessayez quand le tunnel est actif."); return; }
      fetchT(base + href, { headers: HDRS }, 60000)
        .then(function (r) { return r.ok ? r.blob() : null; })
        .then(function (b) { if (!b) { if (w) w.close(); return; } var u = URL.createObjectURL(b); if (w) { w.location = u; } else { window.location.href = u; } })
        .catch(function () { if (w) w.close(); });
    });
  }, true);
})();
</script>
<meta name="theme-color" content="#080D1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CDB Studio">

<link rel="icon" type="image/png" href="brand-logo.png">
<link rel="apple-touch-icon" href="brand-logo.png">
<style>
/* ===== APK dark theme (exact tokens from ui/theme/Color.kt) ===== */
:root{
  --ink:#EDF2FC; --muted:#B6C2DE; --grey:#7E8CA8;
  --bg:#080D1A; --card:#151E36; --cardb:#2B3A5E;
  --navy-dark:#0A1226; --navy-deep:#05091A; --navy-mid:#16223F;
  --navy-soft:#44557E; --navy-line:#243150;
  --orange:#FF7A1A; --orange-dark:#D84315; --amber:#FFB020;
  --green:#22D38A; --red:#FF5A5F;
  --orange-soft:rgba(255,122,26,.20); --green-soft:rgba(34,211,138,.20); --red-soft:rgba(255,90,95,.20);
  --nav-un:#8C9BC4;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink); overscroll-behavior-y:contain;
  font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif; }
a{ color:var(--orange); }
.app{ max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }

/* Header */
header{ position:sticky; top:0; z-index:8;
  background:linear-gradient(120deg,var(--navy-dark),var(--navy-mid),var(--navy-dark));
  box-shadow:0 6px 20px rgba(0,0,0,.5); border-bottom:2px solid transparent;
  background-clip:padding-box; }
header .hrow{ display:flex; align-items:center; gap:11px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 11px; }
header::after{ content:""; display:block; height:2px;
  background:linear-gradient(90deg,var(--amber),var(--orange),var(--orange-dark)); }
.logo{ width:46px;height:46px;border-radius:13px; background:#fff; color:var(--navy-dark);
  display:grid;place-items:center;font-weight:900;font-size:16px;letter-spacing:-1.5px; flex:0 0 auto;
  box-shadow:0 4px 12px rgba(0,0,0,.4); }
.htitle{ flex:1; min-width:0; }
.htitle h1{ font-size:21px; margin:0; font-weight:900; letter-spacing:1px; color:#fff; line-height:1.05; }
.htitle h1 .o{ color:var(--orange); }
.hstatus{ display:flex; align-items:center; gap:7px; margin-top:3px; }
.glow{ width:11px;height:11px;border-radius:50%; background:var(--grey); flex:0 0 auto; position:relative; }
.glow::after{ content:""; position:absolute; inset:-3px; border-radius:50%; background:inherit; opacity:.5;
  animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse{ 0%{ transform:scale(1); opacity:.6;} 100%{ transform:scale(2.1); opacity:0;} }
.hstatus span{ font-size:12px; color:#AEB9DC; font-weight:500; }
.hbtn{ width:40px;height:40px;border-radius:50%; border:0; background:rgba(255,255,255,.10); color:#fff;
  display:grid; place-items:center; font-size:18px; flex:0 0 auto; }
.hbtn.on{ background:var(--orange); }
.badge-sync{ display:inline-flex; align-items:center; gap:3px; background:var(--orange); color:#fff;
  border-radius:8px; padding:1px 7px; font-size:11px; font-weight:900; margin-left:7px; }

/* Offline banner */
.offline{ display:none; align-items:center; gap:10px; padding:12px 16px; cursor:pointer;
  background:linear-gradient(90deg,#D32F2F,#C62828); color:#fff; }
.offline.show{ display:flex; }
.offline b{ font-weight:900; font-size:14px; }
.offline small{ color:#FFE0B2; font-size:12px; display:block; }

/* Main + bottom nav */
main{ flex:1; padding:16px 16px 96px; }
nav{ position:fixed; left:0; right:0; bottom:0; z-index:9;
  background:linear-gradient(180deg,var(--navy-dark),var(--navy-deep));
  border-top:1px solid var(--navy-line); display:flex; max-width:560px; margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom); }
nav button{ flex:1; border:0; background:none; padding:9px 2px 8px; color:var(--nav-un);
  display:flex; flex-direction:column; align-items:center; gap:3px; position:relative; }
nav button .ic{ font-size:20px; line-height:1; width:34px; height:26px; display:grid; place-items:center;
  border-radius:13px; transition:.2s; }
nav button .lb{ font-size:10px; font-weight:900; letter-spacing:.2px; }
nav button.on{ color:#fff; }
nav button.on .ic{ background:var(--orange); }
nav .cnt{ position:absolute; top:4px; right:50%; margin-right:-24px; background:var(--orange); color:#fff;
  font-size:10px; min-width:16px; height:16px; border-radius:8px; display:none; place-items:center;
  padding:0 4px; font-weight:900; }
nav .cnt.show{ display:grid; }

/* Cards / typography */
.card{ background:var(--card); border:1px solid var(--cardb); border-radius:20px; padding:18px;
  margin-bottom:14px; }
h2{ font-size:18px; margin:0 0 14px; color:var(--ink); font-weight:900; display:flex; align-items:center; gap:8px; }
.sub{ color:var(--muted); font-size:12.5px; margin:-8px 0 14px; }
label{ font-size:12px; font-weight:800; color:var(--muted); display:block; margin:0 0 6px;
  text-transform:uppercase; letter-spacing:.4px; }
input,select,textarea{ width:100%; font-size:16px; border:1px solid var(--navy-line); border-radius:12px;
  padding:13px; background:#0d1530; color:var(--ink); font-family:inherit; }
input:focus,select,textarea:focus{ outline:none; border-color:var(--orange); }
textarea{ resize:vertical; min-height:64px; }
select{ -webkit-appearance:none; appearance:none; }
.mt{ margin-top:12px; } .mt8{ margin-top:8px; }
.muted{ color:var(--muted); font-size:13.5px; line-height:1.5; }
.muted2{ color:var(--grey); font-size:12px; }

/* Buttons */
.btn{ width:100%; border:0; border-radius:14px; padding:16px; font-size:16px; font-weight:900;
  color:#fff; background:var(--orange); display:flex; align-items:center; justify-content:center; gap:8px;
  letter-spacing:.3px; }
.btn:active{ transform:scale(.985); }
.btn.navy{ background:var(--navy-mid); } .btn.green{ background:var(--green); } .btn.red{ background:var(--red); }
.btn.soft{ background:var(--navy-soft); }
.btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--navy-line); }
.btn.o-ghost{ background:transparent; color:var(--orange); border:1px solid var(--orange); }
.btn[disabled]{ opacity:.45; }
.btn.sm{ padding:12px; font-size:14px; border-radius:12px; }
.row{ display:flex; gap:10px; } .row>*{ flex:1; }

/* Segmented control */
.seg{ display:flex; gap:8px; margin-top:6px; }
.seg button{ flex:1; border:0; border-radius:12px; padding:11px 6px; font-weight:900; font-size:13px;
  background:var(--card); color:var(--muted); border:1px solid var(--navy-line); }
.seg button.on{ background:var(--orange); color:#fff; border-color:var(--orange); }

/* Chips */
.chips{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{ border:1px solid var(--navy-line); background:var(--card); color:var(--ink); border-radius:10px;
  padding:8px 12px; font-size:13px; font-weight:800; }
.chip.on{ background:var(--orange); border-color:var(--orange); color:#fff; }

/* Status chip */
.schip{ display:inline-block; border-radius:8px; padding:3px 9px; font-size:10px; font-weight:900;
  letter-spacing:.6px; text-transform:uppercase; }

/* List item card */
.item{ background:var(--card); border:1px solid var(--cardb); border-radius:16px; padding:15px; margin-bottom:12px; }
.item .t{ font-weight:900; font-size:16px; color:var(--ink); }
.item .s{ color:var(--muted); font-size:12px; margin-top:2px; }
.flexrow{ display:flex; align-items:center; gap:10px; }

/* Gallery */
.gal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; margin-top:8px; }
.gal .cell{ position:relative; aspect-ratio:1; border-radius:13px; overflow:hidden; background:var(--navy-mid); }
.gal img{ width:100%;height:100%;object-fit:cover; }
.gal .vid{ width:100%;height:100%; background:var(--navy-mid); color:var(--orange); display:grid; place-items:center; font-size:26px; }
.gal .bdg{ position:absolute; bottom:5px; left:5px; background:var(--orange); color:#fff;
  border-radius:8px; padding:1px 6px; font-size:10px; font-weight:900; }
.gal .del{ position:absolute; top:4px; right:4px; background:var(--red); color:#fff; border:0;
  width:20px;height:20px;border-radius:50%; font-size:12px; display:grid; place-items:center; }

/* Preview */
.prev{ margin:14px 0 0; border-radius:14px; overflow:hidden; background:var(--navy-mid); display:none; position:relative; }
.prev img,.prev video{ width:100%; display:block; max-height:300px; object-fit:contain; background:#000; }
.prev .x{ position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); color:#fff; width:30px;height:30px;
  border-radius:50%; border:0; font-size:17px; }

/* Empty / loading */
.empty{ text-align:center; color:var(--muted); padding:46px 14px; }
.empty .big{ width:84px;height:84px;border-radius:50%; margin:0 auto 14px;
  background:linear-gradient(135deg,var(--navy-mid),var(--navy-dark)); border:1px solid var(--navy-line);
  display:grid; place-items:center; font-size:38px; color:var(--orange); }
.empty .et{ font-size:19px; font-weight:800; color:var(--ink); }
.empty .es{ font-size:14px; color:var(--muted); margin-top:6px; }
.center{ display:grid; place-items:center; padding:40px 0; }
.spin{ width:34px;height:34px;border:3px solid rgba(255,122,26,.25);border-top-color:var(--orange);
  border-radius:50%; display:inline-block; animation:sp .7s linear infinite; }
.spin.sm{ width:18px;height:18px;border-width:3px; border-top-color:#fff; vertical-align:middle; }
@keyframes sp{ to{ transform:rotate(360deg); } }

/* post / approval */
.post img,.review img{ width:100%; border-radius:16px; background:var(--navy-mid); display:block; }
.review .mediawrap{ position:relative; }
.review .play{ position:absolute; inset:0; display:grid; place-items:center; }
.review .play span{ width:72px;height:72px;border-radius:50%; background:rgba(0,0,0,.45); color:#fff;
  display:grid; place-items:center; font-size:30px; font-weight:900; }
.review .pub{ position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.4);
  color:#fff; font-weight:900; font-size:22px; border-radius:16px; }

/* overlays */
#ov{ position:fixed; inset:0; background:rgba(5,9,26,.95); z-index:30; display:none;
  align-items:center; justify-content:center; padding:16px; }
#ov img{ max-width:100%; max-height:100%; border-radius:10px; }
#vov{ position:fixed; inset:0; background:rgba(5,9,26,.97); z-index:31; display:none;
  align-items:center; justify-content:center; padding:14px; flex-direction:column; }
#vov video{ width:100%; max-width:520px; max-height:78vh; background:#000; border-radius:14px; }
#vov .vbar{ display:flex; width:100%; max-width:520px; align-items:center; gap:10px; margin-top:10px; color:#fff; }
#vov .vbar b{ flex:1; font-size:13px; }

/* dialog */
#dlg{ position:fixed; inset:0; background:rgba(5,9,26,.6); z-index:35; display:none;
  align-items:center; justify-content:center; padding:18px; }
#dlg .box{ background:var(--card); border:1px solid var(--cardb); border-radius:24px; padding:22px;
  width:100%; max-width:460px; max-height:88vh; overflow:auto; }
#dlg h3{ margin:0 0 8px; font-size:19px; font-weight:900; color:var(--ink); }
#dlg .dmsg{ font-size:14px; color:var(--muted); margin-bottom:14px; }
#dlg .dact{ display:flex; gap:10px; margin-top:18px; }

/* toast */
#toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translateX(-50%);
  z-index:40; background:#0e1422; color:#fff; padding:13px 22px; border-radius:30px; font-weight:700;
  font-size:15px; opacity:0; transition:.25s; pointer-events:none; max-width:88%; text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.5); border:1px solid var(--navy-line); }
#toast.show{ opacity:1; } #toast.ok{ background:var(--green); color:#04221a; } #toast.err{ background:var(--red); }

.statbar{ font-weight:800; font-size:13px; margin:8px 0; }
.statbar.g{ color:var(--green); } .statbar.o{ color:var(--orange); } .statbar.r{ color:var(--red); }
hr.sep{ border:0; border-top:1px solid var(--navy-line); margin:14px 0; }
.totrow{ display:flex; justify-content:space-between; padding:4px 0; }
.totrow .v{ font-weight:900; }
.totbox{ background:rgba(68,85,126,.35); border:1px solid var(--green-soft); border-radius:16px; padding:14px; margin-top:8px; }
</style>
<style id="cdb-responsive">
/* La base est deja mobile-first (.app max 560px, inputs 16px, safe-area).
   Ces regles ne font qu'affiner les tres petits et les grands ecrans. */
@media (max-width:360px){
  main{ padding:12px 12px 92px; }
  .card{ padding:15px; border-radius:16px; }
  header .hrow{ padding-left:12px; padding-right:12px; }
  .htitle h1{ font-size:19px; }
}
@media (min-width:760px){
  .app{ max-width:680px; }
  nav{ max-width:680px; }
  main{ padding:22px 22px 96px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <div class="logo">CDB</div>
      <div class="htitle">
        <h1>CDB<span class="o"> Studio</span><span class="badge-sync" id="syncb" style="display:none">⟳ <span id="syncn">0</span></span></h1>
        <div class="hstatus"><span class="glow" id="glow"></span><span id="stxt">Vérification…</span></div>
      </div>
      <a class="hbtn" href="leads.html" title="Leads & Intégrations" style="text-decoration:none">👥</a>
      <button class="hbtn" id="gear" onclick="toggleSys()" title="Système">⚙</button>
      <button class="hbtn" onclick="refreshAll()" title="Rafraîchir">↻</button>
    </div>
  </header>
  <div class="offline" id="offline" onclick="reconnect()">
    <div style="flex:1"><b>⚠️ SERVEUR HORS LIGNE</b><small id="offsub">Tap pour reconnecter</small></div>
    <div style="font-size:26px">☁</div>
  </div>

  <main id="view"></main>

  <nav id="nav">
    <button data-tab="photos" class="on" onclick="show('photos')"><span class="ic">📷</span><span class="lb">Photos</span></button>
    <button data-tab="soum" onclick="show('soum')"><span class="ic">📄</span><span class="lb">Soum.</span></button>
    <button data-tab="fact" onclick="show('fact')"><span class="ic">🧾</span><span class="lb">Fact.</span></button>
    <button data-tab="voir" onclick="show('voir')"><span class="ic">👁</span><span class="lb">Voir</span><span class="cnt" id="cnt"></span></button>
    <button data-tab="studio" onclick="show('studio')"><span class="ic">🌐</span><span class="lb">Studio</span></button>
    <button data-tab="affaires" onclick="show('affaires')"><span class="ic">💼</span><span class="lb">Affaires</span></button>
  </nav>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden onchange="onPhotoPick(this)">
<input type="file" id="vcam" accept="video/*" capture="environment" hidden onchange="onPhotoPick(this)">
<input type="file" id="fil" accept="image/*,video/*" hidden onchange="onPhotoPick(this)">
<div id="ov" onclick="this.style.display='none'"><img id="ovimg" src="" alt=""></div>
<div id="vov"><video id="vovv" controls playsinline></video><div class="vbar"><b id="vovt"></b><button class="btn o-ghost sm" style="width:auto;padding:8px 16px" onclick="closeVideo()">Fermer</button></div></div>
<div id="dlg"></div>
<div id="toast"></div>

<script>
/* ===================== CORE FRAMEWORK ===================== */
var TAB="photos", SUB="", SYS=false;
var ST={ online:null, services:[], channels:[], pending:0 };
function $(id){ return document.getElementById(id); }
function esc(s){ return (s==null?"":(""+s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function money(x){ var v=parseFloat(x); if(isNaN(v))v=0; return v.toLocaleString("fr-CA",{minimumFractionDigits:2,maximumFractionDigits:2})+" $"; }
function cap1(s){ s=s||""; return s.charAt(0).toUpperCase()+s.slice(1); }
function toast(m,k){ var t=$("toast"); t.innerHTML=m; t.className="show"+(k?(" "+k):"");
  clearTimeout(window._tt); window._tt=setTimeout(function(){ t.className=""; },3500); }
function view(){ return $("view"); }

/* user token (TEAM) */
function userTok(){ try{ return localStorage.getItem("CDB_USER_TOKEN")||""; }catch(e){ return ""; } }
function setUserTok(t){ try{ if(t) localStorage.setItem("CDB_USER_TOKEN",t); else localStorage.removeItem("CDB_USER_TOKEN"); }catch(e){} }
function uq(path){ var t=userTok(); if(!t) return path; return path+(path.indexOf("?")<0?"?":"&")+"u="+encodeURIComponent(t); }
function withU(body){ var t=userTok(); body=body||{}; if(t) body._user=t; return body; }

/* transport helpers — relative /api/* (le pont gere le tunnel en ligne) */
function jget(path){ return fetch(path).then(function(r){ return r.json().then(function(j){ j._http=r.status; return j; }); }); }
function jpost(path,body){ return fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})
  .then(function(r){ return r.json().then(function(j){ j._http=r.status; return j; }); }); }
/* media url : ?t= en ligne (le pont ajoute aussi l'en-tete) */
function mediaUrl(u){ if(!u) return ""; return u; }
function docUrl(kind,file){ return "/api/ops/doc?kind="+encodeURIComponent(kind)+"&file="+encodeURIComponent(file); }

/* approve/reject — APK en ligne (/approve dispatch) ; node en local (chaine marketing) */
function approveCard(id,decision,type,title){
  if(window.CDB.isLocal){
    var file=id+".json";
    if(decision==="refused") return jpost("/api/discard",{file:file});
    return jpost("/api/approve",{file:file,confirm:"APPROUVER"}).then(function(){
      return fetch("/api/pubtoken").then(function(r){return r.json();}).then(function(tk){
        return jpost("/api/publish-all",{file:file,token:(tk&&tk.token)||""}); }); });
  }
  return window.CDB.resolveBase().then(function(base){
    if(!base) return {ok:false,error:"Relais hors ligne"};
    return fetch(base+"/approve",{method:"POST",headers:{"Content-Type":"application/json","X-CDB-Token":window.CDB.API_TOKEN,"ngrok-skip-browser-warning":"1"},
      body:JSON.stringify({token:window.CDB.DISPATCH_TOKEN,id:id,decision:decision,type:type||"marketing",title:title||""})})
      .then(function(r){ return r.json().catch(function(){ return {ok:r.ok}; }); }); });
}

/* dialogs */
function dialog(opts){
  var d=$("dlg"); var body=opts.body||"";
  var acts=(opts.actions||[]).map(function(a,i){ return "<button class='btn "+(a.cls||"ghost")+" sm' data-i='"+i+"'>"+esc(a.label)+"</button>"; }).join("");
  d.innerHTML="<div class='box'>"+(opts.title?"<h3>"+esc(opts.title)+"</h3>":"")+(opts.msg?"<div class='dmsg'>"+esc(opts.msg)+"</div>":"")+body+"<div class='dact'>"+acts+"</div></div>";
  d.style.display="flex";
  (opts.actions||[]).forEach(function(a,i){ d.querySelector("[data-i='"+i+"']").onclick=function(){ if(a.keep!==true) closeDialog(); if(a.onClick) a.onClick(d); }; });
  if(window.CDB.scanImgs) window.CDB.scanImgs(d);
}
function closeDialog(){ $("dlg").style.display="none"; $("dlg").innerHTML=""; }
function confirmBox(title,msg,onYes,yesLabel,yesCls){ dialog({title:title,msg:msg,actions:[
  {label:"Annuler",cls:"ghost"},{label:yesLabel||"Confirmer",cls:yesCls||"red",onClick:onYes}]}); }

/* image / video overlays */
function viewImg(src){ $("ovimg").src=src; if(window.CDB.scanImgs) window.CDB.scanImgs($("ov")); $("ov").style.display="flex"; }
function playVideo(url,title){
  function go(u){ $("vovv").src=u; $("vovt").textContent=title||""; $("vov").style.display="flex"; var p=$("vovv").play(); if(p&&p.catch)p.catch(function(){}); }
  if(!url){ toast("❌ Lecture indisponible (serveur hors ligne)","err"); return; }
  if(!window.CDB.isLocal && url.indexOf("/api/")===0){
    window.CDB.resolveBase().then(function(base){ if(!base){toast("Relais hors ligne","err");return;}
      fetch(base+url,{headers:{"X-CDB-Token":window.CDB.API_TOKEN,"ngrok-skip-browser-warning":"1"}})
        .then(function(r){return r.ok?r.blob():null;}).then(function(b){ go(b?URL.createObjectURL(b):base+url); })
        .catch(function(){ go(base+url); }); });
  } else go(url);
}
function closeVideo(){ var v=$("vovv"); try{ v.pause(); }catch(e){} v.src=""; $("vov").style.display="none"; }

/* ===================== CONNECTION ===================== */
function setConn(online,label){ ST.online=online;
  var g=$("glow"), s=$("stxt");
  if(online===true){ g.style.background="var(--green)"; s.textContent=label||"Connecté"; }
  else if(online===false){ g.style.background="var(--red)"; s.textContent="Déconnecté"; }
  else { g.style.background="var(--grey)"; s.textContent="Vérification…"; }
  $("offline").className="offline"+(online===false?" show":"");
  $("offsub").textContent=ST.pending>0?(ST.pending+" action(s) en attente"):"Tap pour reconnecter";
}
function checkConn(){
  jget("/api/ops/status").then(function(d){
    if(d&&d.offline){ setConn(false); return; }
    ST.services=(d&&d.services)||[]; ST.channels=(d&&d.channels)||ST.channels;
    setConn(true);
    // user label
    if(userTok()) jget(uq("/api/ops/team/whoami")).then(function(w){ if(w&&w.ok) setConn(true,(w.nom||w.user||"Connecté")); }).catch(function(){});
    if(SYS) renderSysteme();
  }).catch(function(){ setConn(false); });
}
function reconnect(){ window.CDB.dropBase && window.CDB.dropBase(); setConn(null); checkConn(); toast("Reconnexion…"); }

function capSugg(){ var q=($("cap").value||"").trim().toLowerCase(); var el=$("sugg"); if(!el) return;

  var hits=PROJ_NAMES.filter(function(n){ return n.toLowerCase().indexOf(q)>=0; }).slice(0,5);

function onPhotoPick(inp){ var f=inp.files[0]; if(!f) return; SEL=f;
  var p=$("prev"); var vid=/^video\//.test(f.type)||/\.(mp4|mov|webm)$/i.test(f.name); var u=URL.createObjectURL(f);
  p.style.display="block";
  p.innerHTML=(vid?("<video src='"+u+"' muted playsinline controls></video>"):("<img src='"+u+"'>"))+"<button class='x' onclick='clearSel()'>✕</button>";
  $("sendbtn").disabled=false;
  ["cam","vcam","fil"].forEach(function(id){ if($(id)!==inp) $(id).value=""; });
}
function clearSel(){ SEL=null; if($("prev")){$("prev").style.display="none"; $("prev").innerHTML="";}
  if($("sendbtn"))$("sendbtn").disabled=true; ["cam","vcam","fil"].forEach(function(id){ if($(id))$(id).value=""; }); }
function sendPhoto(){
  if(!SEL){ toast("Choisis une photo ou une vidéo","err"); return; }
  var f=SEL, cap=($("cap").value||"").trim();
  var vid=/^video\//.test(f.type)||/\.(mp4|mov|webm)$/i.test(f.name);
  var url="/api/ops/upload?kind=chantiers&name=chantier"+(vid?".mp4":".jpg")+(cap?("&text="+encodeURIComponent(cap)):"")+(vid?"&media=video":"");
  var b=$("sendbtn"); b.disabled=true; b.innerHTML="<span class='spin sm'></span> Envoi serveur…";
  f.arrayBuffer().then(function(buf){ return fetch(url,{method:"POST",headers:{"Content-Type":vid?"video/mp4":"image/jpeg"},body:buf}); })
    .then(function(r){ return r.json(); }).then(function(d){
      b.innerHTML="Envoyer";
      if(d&&d.ok){ toast(vid?"Vidéo reçue ✓":"Reçu par CDB Studio ✓","ok"); $("cap").value=""; clearSel(); loadChantiers();
        if(d.status==="processing"&&d.job) pollJob(d.job); }
      else { toast("Erreur : "+((d&&d.error)||"?"),"err"); b.disabled=false; }
    }).catch(function(){ b.innerHTML="Envoyer"; b.disabled=false; toast("Import impossible","err"); });
}
function pollJob(job){ var n=0; var iv=setInterval(function(){ n++;
  jget("/api/ops/chantier-status?job="+encodeURIComponent(job)).then(function(s){
    var st=(s&&s.status)||"processing";
    if(st==="done"){ clearInterval(iv); toast("Studio IA : promo prête ✅","ok"); loadChantiers(); if(TAB==="voir")renderVoir(); refreshPending(); }
    else if(st==="rejected"){ clearInterval(iv); toast("Studio IA : rejetée ❌","err"); }
    else if(st==="error"){ clearInterval(iv); toast("Studio IA : erreur ❌","err"); }
    if(n>66){ clearInterval(iv); }
  }).catch(function(){ if(n>66) clearInterval(iv); }); },1800); }
function loadChantiers(){ jget("/api/ops/chantiers").then(function(d){ PHO=(d&&d.photos)||[]; paintGal();
  jget("/api/ops/projets").then(function(p){ PROJ_NAMES=((p&&p.projets)||[]).map(function(x){return x.nom||x.titre||"";}).filter(Boolean); }).catch(function(){});
}).catch(function(){ if($("gal"))$("gal").innerHTML="<p class='muted'>Serveur hors ligne.</p>"; }); }
function paintGal(){ var el=$("gal"); if(!el) return;

  if(!DEP.length){ el.innerHTML=head+"<div class='empty'><div class='big'>🧾</div><div class='et'>Aucune dépense numérisée</div><div class='es'>Prenez en photo vos reçus (Home Depot, Rona, essence, repas). L'IA extrait les totaux, taxes, et met à jour votre Excel !</div><button class='btn mt' style='max-width:260px;margin:14px auto 0' onclick='depScan()'>📷 NUMÉRISER UN REÇU</button></div>"; return; }

  var cats=[]; DEP.forEach(function(e){ var c=(e.categorie||"").toLowerCase(); if(c&&cats.indexOf(c)<0)cats.push(c); });

function depCard(e){ var cat=(e.categorie||"autre").toLowerCase(); var cc=CATCOL[cat]||["#ECEFF1","#37474F"];
  var review=e.revision_requise===true||(e.validation&&e.validation.coherent===false);
  return "<div class='item'><div class='flexrow'><div style='flex:1;font-size:17px;font-weight:900'>"+esc(e.fournisseur||"Fournisseur inconnu")+"</div><div class='muted2'>"+esc(e.date||"Date inconnue")+"</div>"+
    "<button class='hbtn' style='background:var(--red-soft);color:var(--red);width:32px;height:32px' onclick=\"delDep('"+esc(e.id)+"','"+esc((e.fournisseur||"").replace(/'/g,""))+"',"+num(e.total)+")\">🗑</button></div>"+
    "<div class='flexrow mt8' style='gap:6px'><span class='schip' style='background:"+cc[0]+";color:"+cc[1]+"'>"+esc(cat.toUpperCase())+"</span>"+(review?"<span class='schip' style='background:var(--red-soft);color:var(--red)'>⚠️ À RÉVISER</span>":"")+"</div>"+

    "<div class='flexrow'>"+(e.drive_link?"<a href='"+esc(e.drive_link)+"' target='_blank' style='font-weight:800;font-size:12px'>☁ Reçu Google Drive</a>":"<span class='muted2'>Stocké localement</span>")+
    "<div style='flex:1'></div><div style='text-align:right'><div style='font-size:20px;font-weight:900'>"+money(e.total)+"</div>"+((num(e.tps)>0||num(e.tvq)>0)?"<div class='muted2'>(TPS: "+money(e.tps)+", TVQ: "+money(e.tvq)+")</div>":"")+"</div></div>"+
    (review?"<button class='btn o-ghost sm mt8' style='border-color:var(--red);color:var(--red)' onclick='editDep("+JSON.stringify(JSON.stringify(e)).replace(/'/g,"&#39;")+")'>✏️ CORRIGER LES DONNÉES</button>":"")+"</div>";

function editDep(j){ var e=typeof j==="string"?JSON.parse(j):j;

    "<label>Fournisseur</label><input id='ed_f' value='"+esc(e.fournisseur||"")+"'>"+
    "<label class='mt'>Total ($)</label><input id='ed_t' inputmode='decimal' value='"+esc(e.total||"")+"'>"+

    "<label class='mt'>Description</label><textarea id='ed_desc'>"+esc(e.description||"")+"</textarea>",
    actions:[{label:"Annuler",cls:"ghost"},{label:"ENREGISTRER",cls:"",onClick:function(){
      jpost("/api/ops/depenses/modifier",{id:e.id,total:num($("ed_t").value),fournisseur:$("ed_f").value.trim(),description:$("ed_desc").value.trim(),categorie:($("ed_c").value||"autre").trim().toLowerCase(),date:$("ed_d").value.trim()})
        .then(function(d){ toast(d&&d.ok?"Reçu corrigé ✅":"❌ Échec de la correction",d&&d.ok?"ok":"err"); loadDep(); }); }}]});

function delDep(id,four,tot){ confirmBox("Supprimer ce reçu ?",four+" — "+money(tot)+". Action définitive.",function(){
  jpost("/api/ops/depenses/supprimer",{id:id}).then(function(d){ toast(d&&d.ok?"Supprimé":"❌ Échec de la suppression",d&&d.ok?"ok":"err"); loadDep(); }); },"SUPPRIMER","red"); }
function resetDep(){ confirmBox("Réinitialiser les Factures ?","Tous les reçus seront ARCHIVÉS (réversible côté serveur) et la liste repart à zéro. Le classeur Excel est aussi archivé.",function(){
  jpost("/api/ops/depenses/reset",{}).then(function(d){ toast(d&&d.ok?("Factures réinitialisées ✅ ("+(d.archived||0)+" archivé(s))"):"❌ Échec",d&&d.ok?"ok":"err"); loadDep(); }); },"RÉINITIALISER","red"); }
function shareDep(){ var tot=0; DEP.forEach(function(e){tot+=num(e.total);});
  var lines=DEP.map(function(e){return "• "+(e.date||"")+" | "+(e.fournisseur||"")+" : "+money(e.total);}).join("\n");
  var txt="CDB Factures - Sommaire des dépenses\n\n"+lines+"\n\nTOTAL : "+money(tot);
  if(navigator.share){ navigator.share({title:"CDB Dépenses - Sommaire",text:txt}).catch(function(){}); }
  else { navigator.clipboard&&navigator.clipboard.writeText(txt); toast("Sommaire copié ✓","ok"); } }

/* ===================== AFFAIRES (tab 5) ===================== */

function deniedBox(){ return "<div class='empty'><div class='big'>🔒</div><div class='et'>Accès restreint</div><div class='es'>Votre rôle ne permet pas ce module, ou la session a expiré (onglet Équipe).</div></div>"; }
function docOptions(items,ph){ return "<option value=''>"+esc(ph||"Choisir…")+"</option>"+(items||[]).filter(function(d){return d.numero;}).map(function(d){

  jget("/api/ops/suite/summary").then(function(d){ if(d&&d.ok&&$("asum")){ $("asum").innerHTML=

    "<div style='text-align:center'><div style='font-size:20px'>💳</div><div style='font-weight:900'>"+money(d.recevables||0)+"</div><div class='muted2'>À recevoir</div></div>"+

}

/* ----- Clients ----- */
var CLI=[], CQ="";
function subClients(){ view().innerHTML=subHeader("Clients","CRM")+"<input id='cq' placeholder='Rechercher (nom, tél, courriel…)' oninput=\"CQ=this.value;paintClients()\" value='"+esc(CQ)+"'>"+
  "<button class='btn mt' onclick='addClient()'>+ CLIENT</button><div id='clist' class='mt'><div class='center'><span class='spin'></span></div></div>";
  jget("/api/ops/clients").then(function(d){ CLI=(d&&d.clients)||[]; paintClients(); }).catch(function(){ if($("clist"))$("clist").innerHTML="<p class='statbar r'>Serveur injoignable</p>"; }); }
function cliColor(s){ s=(s||"").toLowerCase(); return s==="actif"?"var(--green)":s==="prospect"?"var(--orange)":(s==="inactif"||s==="perdu")?"var(--grey)":"var(--navy-soft)"; }
function cstatSel(s){ window._cstat=s; Array.prototype.forEach.call(document.querySelectorAll('#cstat button'),function(b){ b.className='chip'+(b.getAttribute('data-v')===s?' on':''); }); }
function paintClients(){ var el=$("clist"); if(!el)return; var q=CQ.toLowerCase();
  var f=CLI.filter(function(c){ return ((c.nom||"")+(c.telephone||"")+(c.courriel||"")+(c.adresse||"")).toLowerCase().indexOf(q)>=0; });
  if(!f.length){ el.innerHTML="<div class='empty'><div class='big'>👤</div><div class='et'>"+(q?"Aucun résultat":"Aucun client")+"</div><div class='es'>"+(q?"Aucune fiche ne correspond.":"Touchez « + CLIENT » pour ajouter une fiche.")+"</div></div>"; return; }
  el.innerHTML=f.map(function(c){ var st=c.statut||"prospect";
    return "<div class='item flexrow' onclick='editClient("+JSON.stringify(JSON.stringify(c)).replace(/'/g,"&#39;")+")'><div style='width:44px;height:44px;border-radius:50%;background:"+cliColor(st)+"22;display:grid;place-items:center;color:"+cliColor(st)+";font-size:20px'>👤</div>"+
      "<div style='flex:1'><div class='t'>"+esc(c.nom||"Client")+"</div><div class='s'>"+esc([c.telephone,c.courriel].filter(Boolean).join(" · "))+"</div></div>"+
      "<span class='schip' style='background:"+cliColor(st)+"22;color:"+cliColor(st)+"'>"+esc(st)+"</span></div>"; }).join("");
}
function addClient(){ dialog({title:"Nouveau client",body:
  "<label>Nom *</label><input id='cl_nom'><label class='mt'>Téléphone</label><input id='cl_tel'><label class='mt'>Courriel</label><input id='cl_cour'><label class='mt'>Adresse</label><input id='cl_adr'><label class='mt'>Notes</label><textarea id='cl_notes'></textarea>",
  actions:[{label:"Annuler",cls:"ghost"},{label:"AJOUTER",cls:"",onClick:function(){ var nom=($("cl_nom").value||"").trim(); if(!nom){toast("Nom requis","err");return;}
    jpost("/api/ops/clients/ajouter",{nom:nom,tel:$("cl_tel").value.trim(),courriel:$("cl_cour").value.trim(),adresse:$("cl_adr").value.trim(),notes:$("cl_notes").value.trim(),source:"App mobile"})
      .then(function(d){ toast(d&&d.ok?"Ajouté ✓":"❌ Échec de l'ajout",d&&d.ok?"ok":"err"); subClients(); }); }}]}); }
function editClient(j){ var c=typeof j==="string"?JSON.parse(j):j; var STAT=["prospect","actif","inactif"]; window._cstat=c.statut||"prospect";
  dialog({title:c.nom||"Client",body:
    "<label>Statut</label><div class='chips' id='cstat'>"+STAT.map(function(s){return "<button class='chip "+(window._cstat===s?"on":"")+"' data-v='"+s+"' onclick=\"cstatSel('"+s+"')\">"+s+"</button>";}).join("")+"</div>"+
    "<label class='mt'>Nom</label><input id='ce_nom' value='"+esc(c.nom||"")+"'><label class='mt'>Téléphone</label><input id='ce_tel' value='"+esc(c.telephone||"")+"'><label class='mt'>Courriel</label><input id='ce_cour' value='"+esc(c.courriel||"")+"'><label class='mt'>Adresse</label><input id='ce_adr' value='"+esc(c.adresse||"")+"'><label class='mt'>Ajouter une note</label><input id='ce_note'>",
    actions:[{label:"Supprimer",cls:"red",onClick:function(){ confirmBox("Supprimer la fiche ?","Action définitive.",function(){ jpost("/api/ops/clients/supprimer",{id:c.id}).then(function(d){ toast(d&&d.ok?"Supprimée":"❌ Échec",d&&d.ok?"ok":"err"); subClients(); }); },"CONFIRMER","red"); }},
      {label:"ENREGISTRER",cls:"",onClick:function(){ jpost("/api/ops/clients/modifier",{id:c.id,statut:window._cstat,note:($("ce_note").value||"").trim()||undefined,nom:$("ce_nom").value.trim(),tel:$("ce_tel").value.trim(),courriel:$("ce_cour").value.trim(),adresse:$("ce_adr").value.trim()})
        .then(function(d){ toast(d&&d.ok?"Mise à jour ✓":"❌ Échec",d&&d.ok?"ok":"err"); subClients(); }); }}]});
}

/* ----- Projets ----- */
var PRJ=[], PRJCLI=[];
function subProjets(){ view().innerHTML=subHeader("Projets","")+"<div id='pbody'><div class='center'><span class='spin'></span></div></div>";
  jget("/api/ops/projets").then(function(d){ PRJ=(d&&d.projets)||[];
    jget("/api/ops/clients").then(function(c){ PRJCLI=(c&&c.clients)||[]; paintProjets(); }).catch(paintProjets); }).catch(function(){ if($("pbody"))$("pbody").innerHTML="<p class='statbar r'>Serveur injoignable</p>"; }); }
function paintProjets(){ var el=$("pbody"); if(!el)return;
  var form="<div class='card'><h2>Nouveau projet</h2><label>Titre du projet</label><input id='pj_t'>"+
    "<label class='mt'>Client (optionnel)</label><select id='pj_c'><option value=''>Choisir un client…</option>"+PRJCLI.map(function(c){return "<option value='"+esc(c.id)+"'>"+esc(c.nom)+"</option>";}).join("")+"</select>"+
    "<button class='btn mt' onclick='createProjet()'>Créer le projet</button></div>";
  if(!PRJ.length){ el.innerHTML=form+"<div class='empty'><div class='big'>💼</div><div class='et'>Aucun projet</div></div>"; return; }
  el.innerHTML=form+PRJ.map(function(p){ var cn=(PRJCLI.filter(function(c){return c.id===p.client_id;})[0]||{}).nom||""; var st=p.statut||"en cours", av=p.avancement||0;
    return "<div class='item'><div class='flexrow'><div style='flex:1'><div class='t'>"+esc(p.titre||p.nom||"")+"</div><div class='s'>"+esc([p.id,cn,p.soumission].filter(Boolean).join(" · "))+"</div></div>"+
      "<button class='hbtn' style='background:var(--red-soft);color:var(--red)' onclick=\"delProjet('"+esc(p.id)+"')\">🗑</button></div>"+
      "<div class='seg mt8'>"+["en cours:En cours","en attente:En attente","termine:Terminé"].map(function(o){var x=o.split(":");return "<button class='"+(st===x[0]?"on":"")+"' onclick=\"projStatut('"+esc(p.id)+"','"+x[0]+"',this)\">"+x[1]+"</button>";}).join("")+"</div>"+
      "<div class='muted2 mt8'>Avancement : <b id='av_"+esc(p.id)+"'>"+av+"</b>%</div><input type='range' min='0' max='100' value='"+av+"' style='width:100%' oninput=\"$('av_"+esc(p.id)+"').textContent=this.value\" onchange=\"projAvance('"+esc(p.id)+"',this.value)\"></div>"; }).join("");
}
function createProjet(){ var t=($("pj_t").value||"").trim(); if(!t){toast("Titre requis","err");return;}
  jpost("/api/ops/projets/creer",{titre:t,client_id:$("pj_c").value||""}).then(function(d){ toast(d&&d.ok?"Créé ✓":"❌ "+((d&&d.error)||"échec"),d&&d.ok?"ok":"err"); subProjets(); }); }
function projStatut(id,v,btn){ Array.prototype.forEach.call(btn.parentNode.children,function(b){b.className=(b===btn?"on":"");}); jpost("/api/ops/projets/modifier",{id:id,statut:v}); }
function projAvance(id,v){ jpost("/api/ops/projets/modifier",{id:id,avancement:parseInt(v,10)}); }
function delProjet(id){ confirmBox("Supprimer le projet ?","Action définitive.",function(){ jpost("/api/ops/projets/supprimer",{id:id}).then(function(){ subProjets(); }); },"SUPPRIMER","red"); }

/* ----- Payer (PAY) ----- */
var PAYS=[], PAYSTR=false, PSOU=[], PFAC=[];
function subPay(){ view().innerHTML=subHeader("Payer","Stripe + Interac")+"<div id='paybody'><div class='center'><span class='spin'></span></div></div>"; window._ptype="soumission"; window._pmode="depot";
  Promise.all([jget(uq("/api/ops/pay/liste")),jget("/api/ops/list?kind=soumissions"),jget("/api/ops/list?kind=factures")]).then(function(r){
    if(r[0]&&r[0].ok){ PAYS=r[0].paiements||[]; PAYSTR=!!r[0].stripe; } else { if($("paybody"))$("paybody").innerHTML=deniedBox(); return; }
    PSOU=(r[1]&&r[1].items)||[]; PFAC=(r[2]&&r[2].items)||[]; paintPay();
  }).catch(function(){ if($("paybody"))$("paybody").innerHTML="<p class='statbar r'>Serveur injoignable</p>"; }); }
function paintPay(){ var el=$("paybody"); if(!el)return;
  var form="<div class='card'><h2>Demander un paiement</h2><div class='seg'>"+["soumission:Soumission","facture:Facture"].map(function(o){var x=o.split(":");return "<button class='"+(window._ptype===x[0]?"on":"")+"' onclick=\"window._ptype='"+x[0]+"';paintPay()\">"+x[1]+"</button>";}).join("")+"</div>"+
    "<label class='mt'>Document</label><select id='pay_doc'>"+docOptions(window._ptype==="soumission"?PSOU:PFAC,window._ptype==="soumission"?"Choisir une soumission…":"Choisir une facture…")+"</select>"+
    "<div class='seg mt'>"+["depot:Acompte","solde:Solde"].map(function(o){var x=o.split(":");return "<button class='"+(window._pmode===x[0]?"on":"")+"' onclick=\"window._pmode='"+x[0]+"';paintPay()\">"+x[1]+"</button>";}).join("")+"</div>"+
    (window._pmode!=="depot"?"<label class='mt'>Montant ($) — optionnel, sinon solde complet</label><input id='pay_m' inputmode='decimal'>":"")+
    "<button class='btn mt' onclick='payCreer()'>Générer le lien</button>"+
    "<p class='muted'>"+(PAYSTR?"Stripe actif + Interac":"Interac (Stripe non configuré)")+"</p><div id='pay_out'></div></div>";
  var list=PAYS.length?PAYS.map(function(p){ var paid=p.statut==="paye";
    return "<div class='item'><div class='flexrow'><div style='flex:1'><div class='t'>"+esc(p.id)+" · "+money(p.montant)+"</div><div class='s'>"+esc(((p.client&&p.client.nom)||"")+" · "+(p.doc_id||""))+"</div></div>"+
      "<span class='schip' style='background:"+(paid?"var(--green-soft);color:var(--green)":"var(--orange-soft);color:var(--amber)")+"'>"+(paid?"payé":"en attente")+"</span></div>"+
      (p.stripe&&p.stripe.url?"<a class='btn o-ghost sm mt8' href='"+esc(p.stripe.url)+"' target='_blank'>💳 Payer par carte (Stripe)</a>":"")+
      (!paid&&p.interac?"<div class='card' style='margin-top:8px;padding:12px'><b>💸 Virement Interac</b><div class='muted'>Destinataire : "+esc(p.interac.courriel||"")+"<br>Montant : "+money(p.interac.montant)+"<br>Question : "+esc(p.interac.question||"")+"<br>Réponse : "+esc(p.interac.reponse||"")+"</div></div>":"")+
      (!paid?"<button class='btn o-ghost sm mt8' onclick=\"emailPay('"+esc(p.id)+"')\">📧 Envoyer le lien au client</button>":"")+
      (!paid?"<button class='btn green sm mt8' onclick=\"payPaid('"+esc(p.id)+"')\">Marquer payé</button>":"")+"</div>"; }).join("")
    :"<div class='empty'><div class='big'>💳</div><div class='et'>Aucun paiement</div><div class='es'>Générez un lien ci-dessus.</div></div>";
  el.innerHTML=form+list;
}
function payCreer(){ var doc=$("pay_doc").value; if(!doc){toast("Numéro requis","err");return;}
  $("pay_out").innerHTML="<div class='statbar o'>Génération…</div>";
  var b={doc:doc,type:window._ptype,mode:window._pmode}; if(window._pmode!=="depot"&&$("pay_m")&&$("pay_m").value)b.montant=num($("pay_m").value);
  jpost("/api/ops/pay/creer",withU(b)).then(function(d){ if(d&&d.ok){ var u=d.stripe_url; $("pay_out").innerHTML=u?"<div class='statbar g'>✅ Lien Stripe ouvert</div><a class='btn o-ghost sm' href='"+esc(u)+"' target='_blank'>Ouvrir Stripe</a>":"<div class='statbar g'>✅ Demande créée — virement Interac (détails ci-dessous)</div>"; if(u)window.open(u,"_blank"); subPay(); }
    else $("pay_out").innerHTML="<div class='statbar r'>❌ "+esc((d&&d.error)||"échec")+"</div>"; }).catch(function(){ $("pay_out").innerHTML="<div class='statbar r'>❌ Réseau</div>"; }); }
function payPaid(id){ jpost("/api/ops/pay/payer",withU({id:id,source:"interac"})).then(function(d){ toast(d&&d.ok?"Marqué payé ✓":"❌ échec",d&&d.ok?"ok":"err"); subPay(); }); }

/* ----- Signatures (SIGN) ----- */
var SIGS=[], SSOU=[], SFAC=[];
function subSign(){ view().innerHTML=subHeader("Signatures","Signature électronique (LCCJTI)")+"<div id='signbody'><div class='center'><span class='spin'></span></div></div>"; window._stype="soumission";
  Promise.all([jget(uq("/api/ops/sign/liste")),jget("/api/ops/list?kind=soumissions"),jget("/api/ops/list?kind=factures")]).then(function(r){
    if(r[0]&&r[0].ok){ SIGS=r[0].signatures||[]; } else { if($("signbody"))$("signbody").innerHTML=deniedBox(); return; }
    SSOU=(r[1]&&r[1].items)||[]; SFAC=(r[2]&&r[2].items)||[]; paintSign();
  }).catch(function(){ if($("signbody"))$("signbody").innerHTML="<p class='statbar r'>Serveur injoignable</p>"; }); }
function paintSign(){ var el=$("signbody"); if(!el)return;
  var form="<div class='card'><h2>Demander une signature</h2><div class='seg'>"+["soumission:Soumission","facture:Facture"].map(function(o){var x=o.split(":");return "<button class='"+(window._stype===x[0]?"on":"")+"' onclick=\"window._stype='"+x[0]+"';paintSign()\">"+x[1]+"</button>";}).join("")+"</div>"+
    "<label class='mt'>Document à signer</label><select id='sg_doc' onchange='signFill()'>"+docOptions(window._stype==="soumission"?SSOU:SFAC,"Choisir un document…")+"</select>"+
    "<label class='mt'>Nom du client</label><input id='sg_nom'><label class='mt'>Contact SMS (optionnel)</label><input id='sg_contact'>"+
    "<button class='btn mt' onclick='signDemander()'>Créer la demande</button><div id='sg_out'></div></div>";
  var list=SIGS.length?SIGS.map(function(s){ var signed=s.statut==="signe";
    return "<div class='item'><div class='flexrow'><div style='flex:1'><div class='t'>"+esc(s.id)+" · "+esc(s.signataire||"")+"</div><div class='s'>"+esc((s.doc_id||"")+" · "+money(s.montant||0))+"</div></div>"+
      "<span class='schip' style='background:"+(signed?"var(--green-soft);color:var(--green)":"var(--orange-soft);color:var(--amber)")+"'>"+(signed?"signé":"en attente")+"</span></div>"+
      (signed&&s.pdf?"<a class='btn o-ghost sm mt8' href='/api/ops/sign/pdf?id="+encodeURIComponent(s.id)+"' target='_blank'>Certificat PDF</a>":"")+
      (!signed?"<button class='btn o-ghost sm mt8' onclick=\"emailSignId('"+esc(s.id)+"')\">📧 Renvoyer le lien au client</button>":"")+"</div>"; }).join("")
    :"<div class='empty'><div class='big'>✍️</div><div class='et'>Aucune signature</div><div class='es'>Créez une demande ci-dessus.</div></div>";
  el.innerHTML=form+list;
}
function signFill(){ var num=$("sg_doc").value; var arr=window._stype==="soumission"?SSOU:SFAC; var d=arr.filter(function(x){return x.numero===num;})[0]; if(d&&d.client){ if(!$("sg_nom").value)$("sg_nom").value=d.client.nom||""; if(!$("sg_contact").value)$("sg_contact").value=d.client.telephone||d.client.courriel||""; } }
function signDemander(){ var doc=$("sg_doc").value,nom=($("sg_nom").value||"").trim(); if(!doc||!nom){toast("Document et nom requis","err");return;}
  $("sg_out").innerHTML="<div class='statbar o'>Création…</div>";
  jpost("/api/ops/sign/demander",withU({doc:doc,type:window._stype,nom:nom,contact:($("sg_contact").value||"").trim()})).then(function(d){
    if(d&&d.ok){ $("sg_out").innerHTML="<div class='statbar g'>✅ Demande créée</div>"+(d.lien?"<div class='row mt8'><a class='btn o-ghost sm' href='"+esc(d.lien)+"' target='_blank'>Ouvrir</a><button class='btn ghost sm' onclick=\"navigator.clipboard.writeText('"+esc(d.lien)+"');toast('Lien copié','ok')\">Copier</button></div>":""); subSign(); }
    else $("sg_out").innerHTML="<div class='statbar r'>❌ "+esc((d&&d.error)||"échec")+"</div>"; }).catch(function(){ $("sg_out").innerHTML="<div class='statbar r'>❌ Réseau</div>"; }); }

/* ----- Échéancier (PLAN) ----- */
var PLANS=[], CONF=[], PLSOU=[];
function subPlan(){ view().innerHTML=subHeader("Échéancier","Planification des chantiers")+"<div id='planbody'><div class='center'><span class='spin'></span></div></div>";
  Promise.all([jget(uq("/api/ops/plan/gantt")),jget("/api/ops/list?kind=soumissions")]).then(function(r){
    if(r[0]&&r[0].ok){ PLANS=r[0].plans||[]; CONF=r[0].conflits||[]; } else { if($("planbody"))$("planbody").innerHTML=deniedBox(); return; }
    PLSOU=(r[1]&&r[1].items)||[]; paintPlan();
  }).catch(function(){ if($("planbody"))$("planbody").innerHTML="<p class='statbar r'>Serveur injoignable</p>"; }); }
function paintPlan(){ var el=$("planbody"); if(!el)return;
  var form="<div class='card'><h2>Planifier depuis une soumission</h2><label>Soumission</label><select id='pl_doc'>"+docOptions(PLSOU,"Choisir une soumission…")+"</select>"+
    "<label class='mt'>Date de début</label><input id='pl_debut' type='date'>"+
    "<button class='btn mt' onclick='planCreer()'>Générer l'échéancier</button><div id='pl_out'></div></div>";
  var conf=CONF.length?"<div class='card' style='background:var(--red-soft);border-color:var(--red)'><b style='color:var(--red)'>⚠️ "+CONF.length+" conflit(s) d'horaire</b>"+CONF.map(function(c){return "<div class='muted'>"+esc(c.message||"")+"</div>";}).join("")+"</div>":"";
  var list=PLANS.length?PLANS.map(function(p){ return "<div class='item'><div class='flexrow'><div style='flex:1'><div class='t'>"+esc(p.projet_id||"")+" · "+esc(p.titre||"")+"</div><div class='s'>"+esc((p.debut||"")+" → "+(p.fin||""))+"</div></div>"+
    "<button class='hbtn' style='background:var(--red-soft);color:var(--red)' onclick=\"delPlan('"+esc(p.projet_id)+"')\">🗑</button></div>"+
    (p.phases||[]).map(function(ph){return "<div class='flexrow' style='font-size:12px'><div style='flex:1' class='muted'>• "+esc(ph.nom||"")+"</div><div class='muted2'>"+esc((ph.debut||"")+" → "+(ph.fin||""))+"</div></div>";}).join("")+"</div>"; }).join("")
    :"<div class='empty'><div class='big'>🗓️</div><div class='et'>Aucun chantier planifié</div><div class='es'>Planifiez ci-dessus.</div></div>";
  el.innerHTML=form+conf+list;
}
function planCreer(){ var doc=$("pl_doc").value,debut=$("pl_debut").value; if(!doc||!debut){toast("Soumission et date requis","err");return;}
  $("pl_out").innerHTML="<div class='statbar o'>Planification…</div>";
  jpost("/api/ops/plan/depuis-soumission",withU({doc:doc,debut:debut})).then(function(d){ if(d&&d.ok){ $("pl_out").innerHTML="<div class='statbar g'>✅ Échéancier généré</div>"; subPlan(); } else $("pl_out").innerHTML="<div class='statbar r'>❌ "+esc((d&&d.error)||"échec")+"</div>"; }).catch(function(){ $("pl_out").innerHTML="<div class='statbar r'>❌ Réseau</div>"; }); }
function delPlan(pid){ confirmBox("Retirer "+pid+" de l'échéancier ?","Le chantier planifié sera retiré du Gantt. Action définitive.",function(){ jpost("/api/ops/plan/supprimer",withU({projet:pid})).then(function(){ subPlan(); }); },"RETIRER","red"); }

/* ----- Commandes (SUPPLY) ----- */
var FOUR=[], BONS=[], SUSOU=[];
function subSupply(){ view().innerHTML=subHeader("Commandes","Bons de commande fournisseurs")+"<div id='supbody'><div class='center'><span class='spin'></span></div></div>";
  Promise.all([jget(uq("/api/ops/supply/fournisseurs")),jget(uq("/api/ops/supply/bons")),jget("/api/ops/list?kind=soumissions")]).then(function(r){
    if(r[0]&&r[0].ok){ FOUR=r[0].fournisseurs||[]; } else { if($("supbody"))$("supbody").innerHTML=deniedBox(); return; }
    BONS=(r[1]&&r[1].commandes)||[]; SUSOU=(r[2]&&r[2].items)||[]; paintSupply();
  }).catch(function(){ if($("supbody"))$("supbody").innerHTML="<p class='statbar r'>Serveur injoignable</p>"; }); }
function paintSupply(){ var el=$("supbody"); if(!el)return;
  var c1="<div class='card'><h2>Nouveau bon de commande</h2><label>Soumission</label><select id='su_doc'>"+docOptions(SUSOU,"Choisir une soumission…")+"</select>"+
    "<label class='mt'>Fournisseur</label><select id='su_four'><option value=''>Choisir un fournisseur…</option>"+FOUR.map(function(f){return "<option value='"+esc(f.id)+"'>"+esc(f.nom)+(f.categorie?" · "+esc(f.categorie):"")+"</option>";}).join("")+"</select>"+
    "<button class='btn mt' onclick='supBon()'>Créer le bon</button><div id='su_out'></div></div>";
  var c2="<div class='card'><h2>Ajouter un fournisseur</h2><label>Nom du fournisseur</label><input id='su_n'><label class='mt'>Courriel (optionnel)</label><input id='su_c'><button class='btn mt' onclick='supFour()'>Ajouter le fournisseur</button></div>";
  var list=BONS.length?BONS.map(function(b){ var recu=b.statut==="recue";
    return "<div class='item'><div class='flexrow'><div style='flex:1'><div class='t'>"+esc(b.id)+" · "+money(b.total_estime||0)+"</div><div class='s'>"+esc((b.fournisseur||"")+" · "+(b.soumission||""))+"</div></div>"+
      "<span class='schip' style='background:"+(recu?"var(--green-soft);color:var(--green)":"var(--orange-soft);color:var(--amber)")+"'>"+esc(b.statut||"")+"</span></div>"+
      "<div class='row mt8'><button class='btn o-ghost sm' onclick=\"supPdf('"+esc(b.id)+"')\">PDF</button>"+(!recu?"<button class='btn green sm' onclick=\"supRecu('"+esc(b.id)+"')\">Reçu</button>":"")+"</div></div>"; }).join("")
    :"<div class='empty'><div class='big'>🛒</div><div class='et'>Aucun bon de commande</div><div class='es'>Créez-en un ci-dessus.</div></div>";
  el.innerHTML=c1+c2+list;
}
function supBon(){ var doc=$("su_doc").value,f=$("su_four").value; if(!doc||!f){toast("Soumission et fournisseur requis","err");return;}
  $("su_out").innerHTML="<div class='statbar o'>Création…</div>"; jpost("/api/ops/supply/bon",withU({doc:doc,fournisseur:f})).then(function(d){ if(d&&d.ok){ $("su_out").innerHTML="<div class='statbar g'>✅ Bon créé</div>"; subSupply(); } else $("su_out").innerHTML="<div class='statbar r'>❌ "+esc((d&&d.error)||"échec")+"</div>"; }); }
function supFour(){ var n=($("su_n").value||"").trim(); if(!n){toast("Nom du fournisseur requis","err");return;} jpost("/api/ops/supply/fournisseur-ajouter",withU({nom:n,courriel:($("su_c").value||"").trim()})).then(function(d){ toast(d&&d.ok?"Ajouté ✓":"❌ échec",d&&d.ok?"ok":"err"); subSupply(); }); }
function supPdf(id){ jpost("/api/ops/supply/bon-pdf",withU({id:id})).then(function(d){ if(d&&d.ok){ window.open("/api/ops/supply/bon-pdf-file?id="+encodeURIComponent(id),"_blank"); } else toast("PDF: échec","err"); }); }
function supRecu(id){ jpost("/api/ops/supply/bon-statut",withU({id:id,statut:"recue"})).then(function(){ subSupply(); }); }

/* ----- Équipe (TEAM) ----- */
var TEAM=[], ROLES={};
function subTeam(){ view().innerHTML=subHeader("Équipe",userTok()?"Session active":"Mono-utilisateur")+"<div id='teambody'><div class='center'><span class='spin'></span></div></div>";
  jget(uq("/api/ops/team/liste")).then(function(d){
    if(d&&d.ok){ TEAM=d.membres||[]; ROLES=d.roles||{}; paintTeam(TEAM.length?"ok":"bootstrap"); }
    else { var e=((d&&d.error)||"").toLowerCase(); var login=!userTok()||e.indexOf("refus")>=0||e.indexOf("acces")>=0||e.indexOf("accès")>=0; paintTeam(login?"login":"bootstrap"); }
  }).catch(function(){ if($("teambody"))$("teambody").innerHTML="<p class='statbar r'>Serveur injoignable</p>"; }); }
function paintTeam(mode){ var el=$("teambody"); if(!el)return;
  if(mode==="bootstrap"){ el.innerHTML="<div class='card'><h2>Créer le compte propriétaire</h2><p class='sub'>Premier compte (accès total).</p>"+
    "<label>Nom</label><input id='tm_nom'><label class='mt'>Identifiant</label><input id='tm_user'><label class='mt'>Mot de passe</label><input id='tm_pwd' type='password'><label class='mt'>Courriel (optionnel)</label><input id='tm_cour'>"+
    "<button class='btn mt' onclick='teamBoot()'>Créer le propriétaire</button></div>"; return; }
  if(mode==="login"){ el.innerHTML="<div class='card'><h2>Connexion</h2><label>Identifiant</label><input id='tl_user'><label class='mt'>Mot de passe</label><input id='tl_pwd' type='password'><button class='btn mt' onclick='teamLogin()'>Se connecter</button></div>"; return; }
  var head=userTok()?"<div class='card'><div class='flexrow'><div style='flex:1;font-weight:900'>Session active</div><button class='btn o-ghost sm' style='width:auto;padding:9px 16px' onclick='teamLogout()'>Déconnexion</button></div></div>":"";
  var add="<div class='card'><h2>Ajouter un membre</h2><label>Nom</label><input id='ta_nom'><label class='mt'>Identifiant</label><input id='ta_user'><label class='mt'>Mot de passe</label><input id='ta_pwd' type='password'>"+
    "<label class='mt'>Rôle</label><select id='ta_role'>"+Object.keys(ROLES).map(function(k){return "<option value='"+esc(k)+"'>"+esc(ROLES[k])+"</option>";}).join("")+"</select><button class='btn mt' onclick='teamAdd()'>Ajouter</button></div>";
  var list=TEAM.map(function(m){ return "<div class='item'><div class='flexrow'><div style='flex:1'><div class='t'>"+esc(m.nom||"")+"  @"+esc(m.username||m.user||"")+"</div><div class='s' onclick=\"teamRoleDlg('"+esc(m.username||m.user)+"')\">"+esc(ROLES[m.role]||m.role||"")+" ▾</div></div>"+
    "<button class='btn "+(m.actif?"o-ghost":"green")+" sm' style='width:auto;padding:9px 14px;"+(m.actif?"border-color:var(--red);color:var(--red)":"")+"' onclick=\"teamActif('"+esc(m.username||m.user)+"',"+(m.actif?"false":"true")+")\">"+(m.actif?"Désactiver":"Activer")+"</button></div></div>"; }).join("");
  el.innerHTML=head+add+list;
}
function teamBoot(){ jpost("/api/ops/team/creer-proprietaire",{nom:$("tm_nom").value.trim(),user:$("tm_user").value.trim(),mdp:$("tm_pwd").value,courriel:$("tm_cour").value.trim()}).then(function(d){ if(d&&d.ok){toast("Propriétaire créé ✓","ok"); subTeam();} else toast("❌ "+((d&&d.error)||"échec"),"err"); }); }
function teamLogin(){ jpost("/api/ops/team/login",{user:$("tl_user").value.trim(),mdp:$("tl_pwd").value}).then(function(d){ if(d&&d.ok&&d.token){ setUserTok(d.token); toast("Connecté ✓","ok"); subTeam(); checkConn(); } else toast("Identifiants invalides","err"); }); }
function teamLogout(){ setUserTok(null); toast("Déconnecté"); subTeam(); checkConn(); }
function teamAdd(){ jpost("/api/ops/team/ajouter",withU({nom:$("ta_nom").value.trim(),user:$("ta_user").value.trim(),mdp:$("ta_pwd").value,role:$("ta_role").value,courriel:""})).then(function(d){ toast(d&&d.ok?"Ajouté ✓":"❌ "+((d&&d.error)||"échec"),d&&d.ok?"ok":"err"); subTeam(); }); }
function teamActif(user,actif){ jpost("/api/ops/team/actif",withU({user:user,actif:actif})).then(function(){ subTeam(); }); }
function teamRoleDlg(user){ dialog({title:"Changer le rôle de "+user,body:Object.keys(ROLES).map(function(r){return "<button class='btn ghost sm' style='margin-bottom:8px' onclick=\"teamRole('"+esc(user)+"','"+esc(r)+"')\">"+esc(ROLES[r])+"</button>";}).join(""),actions:[{label:"Annuler",cls:"ghost"}]}); }
function teamRole(user,role){ closeDialog(); jpost("/api/ops/team/role",withU({user:user,role:role})).then(function(){ subTeam(); }); }

/* ===================== SYSTÈME (gear) ===================== */
function renderSysteme(){ view().innerHTML="<div class='card'><div class='flexrow'><div style='flex:1'><div style='font-size:24px;font-weight:900'>Système & Canaux</div><div class='muted2'>Services · diffusion · maintenance</div></div><button class='hbtn' style='background:var(--navy-line)' onclick='loadSysteme()'>↻</button></div></div><div id='sysbody'><div class='center'><span class='spin'></span></div></div>"; loadSysteme(); }
function loadSysteme(){ Promise.all([jget("/api/ops/status"),jget("/api/ops/channels")]).then(function(r){
  var svc=(r[0]&&r[0].services)||[]; var ch=(r[1]&&r[1].channels)||[]; paintSysteme(svc,ch);
}).catch(function(){ if($("sysbody"))$("sysbody").innerHTML="<p class='statbar r'>Serveur injoignable</p>"; }); }
function paintSysteme(svc,ch){ var el=$("sysbody"); if(!el)return;
  function up(s){ return s==="up"||s==="config"; }
  var services=svc.length?svc.map(function(s){ return "<div class='item flexrow'><span class='glow' style='background:"+(up(s.state)?"var(--green)":"var(--red)")+"'></span><div style='flex:1'><div class='t'>"+esc(s.label||"—")+"</div>"+(s.detail?"<div class='s'>"+esc(s.detail)+"</div>":"")+"</div><span class='schip' style='background:"+(up(s.state)?"var(--green-soft);color:var(--green)":"var(--red-soft);color:var(--red)")+"'>"+(up(s.state)?"OK":"OFF")+"</span></div>"; }).join("")
    :"<div class='empty'><div class='big'>☁</div><div class='et'>Serveur injoignable</div><div class='es'>Assurez-vous que le serveur local est lancé.</div><button class='btn mt' style='max-width:200px;margin:14px auto 0' onclick='loadSysteme()'>RÉESSAYER</button></div>";
  var chans=ch.length?ch.map(function(c){ return "<div class='item flexrow'><span class='glow' style='background:"+(c.configured?"var(--green)":"var(--grey)")+"'></span><div style='flex:1'><div class='t'>"+esc(cap1(c.label||""))+"</div></div><span class='schip' style='background:"+(c.configured?"var(--green-soft);color:var(--green)":"var(--navy-line);color:var(--muted)")+"'>"+(c.configured?"Configuré":"Absent")+"</span></div>"; }).join(""):"<p class='muted'>Aucune donnée de canal.</p>";
  el.innerHTML="<div class='card'><h2>Services</h2>"+services+"</div>"+
    "<div class='card'><h2>Canaux sociaux</h2><button class='btn navy sm' onclick='sysPreflight(this)'>VÉRIFIER LES CANAUX (PRÉ-VOL)</button><div id='sys_pf' class='mt8'></div>"+chans+"</div>"+
    "<div class='card'><h2>Maintenance</h2><div class='row'><button class='btn ghost sm' onclick='sysBackup(this)'>💾 Sauvegarde</button><button class='btn ghost sm' onclick='sysSante(this)'>❤ Santé</button></div><div id='sys_m' class='mt8'></div>"+
    "<p class='muted2' style='text-align:center;margin-top:14px'>CDB Studio · iD01t Productions</p></div>";
}
function sysPreflight(b){ b.disabled=true; b.innerHTML="<span class='spin sm'></span>"; jpost("/api/ops/preflight",{}).then(function(d){ $("sys_pf").innerHTML="<div class='statbar "+(d&&d.ok?"g":"o")+"'>"+(d&&d.ok?"✅ Pré-vol réussi":"⚠️ Pré-vol : voir détails serveur")+"</div>"; loadSysteme(); }).catch(function(){ b.disabled=false; b.innerHTML="VÉRIFIER LES CANAUX (PRÉ-VOL)"; }); }
function sysBackup(b){ b.disabled=true; $("sys_m").innerHTML="<div class='statbar o'>Sauvegarde…</div>"; jpost("/api/ops/backup",{}).then(function(d){ $("sys_m").innerHTML="<div class='statbar "+(d&&d.ok?"g":"r")+"'>"+(d&&d.ok?"Sauvegarde terminée ✅":"Sauvegarde indisponible ❌")+"</div>"; b.disabled=false; }).catch(function(){ $("sys_m").innerHTML="<div class='statbar r'>Sauvegarde indisponible ❌</div>"; b.disabled=false; }); }
function sysSante(b){ b.disabled=true; $("sys_m").innerHTML="<div class='statbar o'>Diagnostic santé…</div>"; jpost("/api/ops/sante",{}).then(function(d){ var v=(d&&d.verdict)||(d&&d.ok?"Système sain ✅":"Anomalies détectées ⚠️"); $("sys_m").innerHTML="<div class='statbar "+(d&&d.ok?"g":"o")+"'>"+esc(v)+"</div>"; b.disabled=false; }).catch(function(){ $("sys_m").innerHTML="<div class='statbar r'>Santé indisponible ❌</div>"; b.disabled=false; }); }

/* ===================== INIT ===================== */
checkConn(); refreshPending();
setInterval(checkConn,45000); setInterval(refreshPending,60000);
show("photos");

/* ===================== PWA / Service Worker ===================== */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
